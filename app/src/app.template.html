<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- surfaces (very low contrast between them, on purpose) ---- */
    --color-surface-page:#0b0b10;
    --color-surface-card:#1a1826;
    --color-surface-card-deep:#0f0f15;
    --color-surface-chip:#221f31;
    --color-surface-chip-hover:#2a2639;
    /* ---- text ---- */
    --color-text-white:#ffffff;
    --color-text-heading:#f5f4f9;
    --color-text-secondary:#c1bfcf;
    --color-text-muted:#9a97ac;
    --color-text-subtle:#847f98;
    --color-text-faint:#5d5a6d;
    --color-text-accent:#c1a3f5;
    /* ---- borders (hairline, low contrast) ---- */
    --color-border-default:rgba(255,255,255,.07);
    --color-border-subtle:rgba(255,255,255,.045);
    --color-border-strong:rgba(255,255,255,.13);
    --color-border-purple:#8b6ae0;
    /* ---- accent: one flat hue for most uses, gradient reserved for a few moments ---- */
    --color-accent:#a78bfa;
    --color-accent-soft:rgba(167,139,250,.12);
    --gradient-primary:linear-gradient(100deg,#AD46FF,#F6339A);
    --gradient-primary-hover:linear-gradient(100deg,#983BE3,#D51C7E);
    --gradient-primary-focus:linear-gradient(100deg,#A246E5,#C1247A);
    /* ---- status (used only where it means "quality", not decoration) ---- */
    --color-status-success:#3ecf8e;
    --color-status-info:#5b9df9;
    --color-status-warning:#e8a53d;
    --color-status-error:#ea5470;
    /* ---- monochrome purple spectrum (Figma shade system) ----
       Creative Overview's charts/visuals pull from this single-hue ramp
       instead of the red/blue/amber/green status colors above, which stay
       reserved for the Insights & Actionables tab's quality-tier coding. */
    --spectrum-700:#733EE0; --spectrum-650:#6B5EEA; --spectrum-600:#7681F5;
    --spectrum-550:#8A7CFF; --spectrum-500:#B787F5; --spectrum-450:#C98BFF;
    --spectrum-400:#DD83F5; --spectrum-350:#E89BFF; --spectrum-300:#F0A8FF;
    --spectrum-250:#F7C4FF; --spectrum-200:#F3D7FF; --spectrum-150:#F8EFFF;
    /* ---- radius ---- */
    --radius-sm:8px; --radius-md:10px; --radius-lg:12px; --radius-xl:16px; --radius-pill:999px;
    /* ---- spacing scale ---- */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px;
    /* ---- fonts ---- */
    --font-primary:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'Inter',system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(167,139,250,.07), transparent 60%),
      radial-gradient(ellipse 50% 35% at 85% 15%, rgba(236,72,153,.05), transparent 60%),
      var(--color-surface-page);
    color:var(--color-text-heading);font-family:var(--font-primary);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  svg{display:block;}
  ::selection{background:var(--color-accent);color:#100c1a;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--color-border-strong);border-radius:8px;}
  .tabnum{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
  .ic{display:inline-flex;flex:none;}
  .ic svg{width:100%;height:100%;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

  /* ================= shell ================= */
  .shell{display:grid;grid-template-columns:228px 1fr;min-height:100vh;}
  .shell.collapsed{grid-template-columns:66px 1fr;}
  .sidebar{background:var(--color-surface-card-deep);border-right:1px solid var(--color-border-subtle);padding:18px 10px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;}
  .sidebar.collapsed .brand span,
  .sidebar.collapsed .brand b,
  .sidebar.collapsed .nav-section,
  .sidebar.collapsed .nav-item span:not(.ic),
  .sidebar.collapsed .nav-item .beta,
  .sidebar.collapsed .nav-item .soon{display:none;}
  .sidebar.collapsed .brand-row{flex-direction:column;gap:10px;justify-content:center;padding:2px 4px var(--sp-5);}
  .sidebar.collapsed .brand{gap:0;}
  .sidebar.collapsed .nav-item{justify-content:center;padding:9px;}
  .sidebar.collapsed .collapse-btn{transform:rotate(180deg);}
  .brand-row{display:flex;align-items:center;justify-content:space-between;padding:2px 8px var(--sp-5);}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-logo{height:30px;width:auto;display:block;object-fit:contain;}
  .sidebar.collapsed .brand-logo{height:24px;}
  .collapse-btn{width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--color-border-default);background:transparent;color:var(--color-text-subtle);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .collapse-btn .ic{width:14px;height:14px;}

  .nav-scroll{flex:1;overflow-y:auto;padding-bottom:8px;}
  .nav-section{font-size:10.5px;font-weight:700;letter-spacing:.7px;color:var(--color-text-subtle);text-transform:uppercase;padding:16px 10px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-md);color:var(--color-text-secondary);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:1px;}
  .nav-item .ic{width:16px;height:16px;color:var(--color-text-subtle);}
  .nav-item:hover{background:var(--color-white-08,rgba(255,255,255,.05));color:var(--color-text-heading);}
  .nav-item.active{background:var(--gradient-primary);color:#fff;}
  .nav-item.active .ic{color:#fff;}
  .nav-item.disabled{opacity:.4;cursor:default;}
  .nav-item .beta{margin-left:auto;font-size:9px;font-weight:700;color:var(--color-text-accent);border:1px solid var(--color-border-purple);border-radius:5px;padding:1px 5px;}
  .nav-item .soon{margin-left:auto;font-size:8.5px;font-weight:600;color:var(--color-text-faint);border:1px solid var(--color-border-default);border-radius:5px;padding:1px 5px;letter-spacing:.2px;}

  .main{min-width:0;}
  .topbar{padding:22px 32px 0;max-width:1320px;width:100%;margin:0 auto;}
  .breadcrumb{font-size:12px;color:var(--color-text-subtle);margin-bottom:var(--sp-6);}
  .breadcrumb b{color:var(--color-text-secondary);font-weight:600;}

  .content{padding:2px 32px 64px;display:flex;flex-direction:column;gap:var(--sp-7);max-width:1320px;width:100%;margin:0 auto;}

  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-head h1{font-size:21px;font-weight:700;margin:0 0 4px;letter-spacing:-.2px;}
  .page-head p{margin:0;font-size:13px;color:var(--color-text-muted);}

  /* ================= date range ================= */
  .daterange{position:relative;flex:none;}
  .daterange-row{display:flex;align-items:center;gap:8px;}
  .daterange-trigger{display:flex;align-items:center;gap:9px;background:var(--color-surface-chip);border:1px solid var(--color-border-default);border-radius:var(--radius-lg);padding:9px 14px;cursor:pointer;color:var(--color-text-secondary);font-size:12.5px;}
  .daterange-trigger:hover{border-color:var(--color-border-strong);}
  .daterange.open .daterange-trigger{border-color:var(--color-border-purple);}
  .daterange-trigger .ic{width:14px;height:14px;color:var(--color-text-subtle);}
  .daterange-trigger .drlabel{color:var(--color-text-subtle);}
  .daterange-trigger .drvalue{color:var(--color-text-heading);font-weight:600;}
  .daterange-trigger .dot{color:var(--color-text-faint);}
  .daterange-trigger .chev{margin-left:2px;color:var(--color-text-muted);width:12px;height:12px;transition:transform .15s;}
  .daterange.open .chev{transform:rotate(180deg);}
  .icon-btn{width:35px;height:35px;border-radius:var(--radius-md);background:var(--color-surface-chip);border:1px solid var(--color-border-default);color:var(--color-text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .icon-btn .ic{width:15px;height:15px;}
  .icon-btn:hover{color:var(--color-text-heading);border-color:var(--color-border-strong);}
  .icon-btn.spinning{cursor:progress;color:var(--color-accent);border-color:var(--color-border-purple);}
  .icon-btn.spinning .ic{animation:cre-spin 0.9s linear infinite;}
  .daterange-panel{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:60;width:300px;background:var(--color-surface-card);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);box-shadow:0 18px 44px rgba(0,0,0,.5);overflow:hidden;}
  .daterange.open .daterange-panel{display:block;}
  .daterange.open .daterange-panel.dr-panel-calendar{display:flex;}
  .dr-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;}
  .dr-opt:hover{background:rgba(255,255,255,.04);}
  .dr-opt .drname{font-size:12.5px;color:var(--color-text-secondary);}
  .dr-opt.sel .drname{color:var(--color-text-accent);font-weight:600;}
  .dr-opt .check{color:var(--color-status-success);width:13px;height:13px;margin-left:6px;}

  .daterange-panel.dr-panel-calendar{width:auto;right:0;}
  .dr-cal-sidebar{width:172px;flex:none;border-right:1px solid var(--color-border-subtle);padding:6px;max-height:420px;overflow-y:auto;}
  .dr-cal-side-title{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--color-text-faint);font-weight:700;padding:8px 10px 4px;}
  .dr-cal-main{width:600px;padding:16px;display:flex;flex-direction:column;gap:14px;}
  .dr-cal-inputbar{display:flex;align-items:center;gap:10px;background:var(--color-surface-chip);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:9px 14px;}
  .dr-cal-input{font-size:13px;color:var(--color-text-heading);font-weight:600;font-family:var(--font-mono);}
  .dr-cal-input.placeholder{color:var(--color-text-faint);font-weight:500;}
  .dr-cal-sep{color:var(--color-text-faint);}
  .dr-cal-inputbar .ic{margin-left:auto;color:var(--color-text-subtle);width:15px;height:15px;}
  .dr-cal-nav{display:flex;align-items:center;gap:4px;}
  .dr-cal-navbtn{width:26px;height:26px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);cursor:pointer;flex:none;}
  .dr-cal-navbtn:hover{background:var(--color-surface-chip);color:var(--color-text-heading);}
  .dr-cal-navbtn .ic{width:14px;height:14px;}
  .dr-cal-monthlabel{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--color-text-heading);}
  .dr-cal-months{display:flex;gap:18px;}
  .dr-cal-month{flex:1;min-width:0;}
  .dr-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dr-cal-dow{font-size:10px;color:var(--color-text-faint);text-align:center;padding:4px 0;font-weight:700;}
  .dr-day{position:relative;text-align:center;font-size:12px;color:var(--color-text-secondary);padding:6px 0;cursor:pointer;border-radius:6px;}
  .dr-day:hover{background:var(--color-surface-chip);}
  .dr-day.out{color:var(--color-text-faint);opacity:.4;}
  .dr-day.inrange{background:rgba(167,139,250,.16);border-radius:0;}
  .dr-day.rangestart{border-radius:6px 0 0 6px;background:rgba(167,139,250,.16);}
  .dr-day.rangeend{border-radius:0 6px 6px 0;background:rgba(167,139,250,.16);}
  .dr-day.sel{background:var(--gradient-primary);color:#fff;font-weight:700;}
  .dr-cal-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:6px;border-top:1px solid var(--color-border-subtle);}
  .dr-cal-btn{font-family:inherit;font-size:12px;font-weight:600;padding:8px 16px;border-radius:var(--radius-md);cursor:pointer;border:1px solid var(--color-border-default);background:var(--color-surface-chip);color:var(--color-text-secondary);}
  .dr-cal-btn:hover{border-color:var(--color-border-strong);color:var(--color-text-heading);}
  .dr-cal-btn.primary{background:var(--gradient-primary);border:none;color:#fff;}
  .dr-cal-btn.primary:hover{background:var(--gradient-primary-hover);}
  .dr-cal-btn.primary:focus-visible{background:var(--gradient-primary-focus);outline:none;}
  .dr-cal-btn.primary:disabled{opacity:.4;cursor:not-allowed;}
  @media (max-width:760px){
    .daterange-panel.dr-panel-calendar{flex-direction:column;right:auto;left:0;}
    .dr-cal-sidebar{width:100%;max-height:120px;border-right:none;border-bottom:1px solid var(--color-border-subtle);}
    .dr-cal-main{width:min(94vw,420px);}
    .dr-cal-months{flex-direction:column;}
  }

  /* ================= config bar ================= */
  .config-bar{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;background:var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-xl);padding:var(--sp-4);}
  .config-group{display:flex;flex-direction:column;gap:6px;}
  .config-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--color-text-subtle);font-weight:700;padding-left:2px;}
  .divider-v{width:1px;align-self:stretch;background:var(--color-border-default);margin:0 4px;}

  .xselect{position:relative;}
  .xselect-trigger{display:flex;align-items:center;gap:8px;background:var(--color-surface-chip);border:1px solid var(--color-border-default);color:var(--color-text-heading);border-radius:var(--radius-md);padding:9px 12px;font-size:12.5px;cursor:pointer;min-width:158px;max-width:230px;}
  .xselect-trigger:hover{border-color:var(--color-border-strong);}
  .xselect.open .xselect-trigger{border-color:var(--color-border-purple);}
  .xselect-trigger .tlabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .xselect-trigger .ic{width:13px;height:13px;color:var(--color-text-faint);}
  .xselect-panel{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:55;width:262px;background:var(--color-surface-card);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);box-shadow:0 16px 38px rgba(0,0,0,.48);overflow:hidden;}
  .xselect.open .xselect-panel{display:block;}
  .xselect-search{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--color-border-subtle);}
  .xselect-search .ic{width:13px;height:13px;color:var(--color-text-faint);}
  .xselect-search input{flex:1;background:transparent;border:none;outline:none;color:var(--color-text-heading);font-size:12.5px;font-family:inherit;}
  .xselect-search input::placeholder{color:var(--color-text-faint);}
  .xselect-list{max-height:250px;overflow-y:auto;padding:5px;}
  .xselect-opt{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:var(--radius-sm);cursor:pointer;font-size:12.5px;color:var(--color-text-secondary);}
  .xselect-opt:hover{background:rgba(255,255,255,.05);color:var(--color-text-heading);}
  .xselect-opt.sel{color:var(--color-text-white);background:var(--color-accent-soft);font-weight:600;}
  .xselect-opt .meta{margin-left:auto;font-size:10.5px;color:var(--color-text-faint);font-family:var(--font-mono);}
  .xselect-opt.disabled{opacity:.4;cursor:not-allowed;}
  .xselect-empty{padding:16px 10px;text-align:center;color:var(--color-text-faint);font-size:12px;}

  .pill-toggle{display:flex;width:fit-content;align-self:flex-start;background:var(--color-surface-chip);border:1px solid var(--color-border-default);border-radius:var(--radius-pill);padding:3px;gap:2px;}
  .pill-toggle button{border:none;background:transparent;color:var(--color-text-muted);font-size:12px;font-weight:600;padding:7px 13px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;font-family:inherit;}
  .pill-toggle button.active{background:var(--gradient-primary);color:#fff;}
  .pill-toggle button:not(.active):hover{color:var(--color-text-heading);}

  .active-filters{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--color-text-muted);background:var(--color-surface-chip);border:1px solid var(--color-border-default);border-radius:var(--radius-pill);padding:5px 10px;}
  .chip b{color:var(--color-text-heading);font-weight:600;}
  .chip .x{cursor:pointer;color:var(--color-text-faint);width:11px;height:11px;}
  .chip .x:hover{color:var(--color-status-error);}

  /* ================= sections ================= */
  .section-label{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--color-text-secondary);font-weight:700;margin-bottom:var(--sp-3);}

  .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);}
  .summary-card{background:var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-xl);padding:var(--sp-5);}
  .summary-label{font-size:12px;color:var(--color-text-muted);font-weight:600;margin-bottom:var(--sp-3);}
  .summary-value{font-size:25px;font-weight:600;letter-spacing:-.3px;margin-bottom:5px;font-family:var(--font-mono);color:var(--color-text-heading);}
  .summary-value.spend{color:var(--color-text-accent);}
  .summary-value.revenue{color:var(--color-status-success);}
  .summary-sub{font-size:11.5px;color:var(--color-text-subtle);}

  .row-50{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4);align-items:stretch;}
  .panel{background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,0) 40%), var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-xl);padding:var(--sp-5);display:flex;flex-direction:column;box-shadow:0 12px 32px -12px rgba(0,0,0,.55);}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:var(--sp-4);}
  .panel-head h3{font-size:15px;font-weight:700;margin:0 0 3px;color:var(--color-text-heading);}
  .panel-head p{margin:0;font-size:11.5px;color:var(--color-text-muted);}
  .panel-select{flex:none;}
  .panel-body{flex:1;display:flex;flex-direction:column;}

  /* format split donut */
  .donut-row{display:flex;align-items:center;gap:var(--sp-6);flex:1;}
  .donut-wrap{position:relative;width:168px;height:168px;flex:none;filter:drop-shadow(0 0 26px rgba(167,139,250,.32));}
  .donut-center{pointer-events:none;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-seg{transition:stroke-opacity .12s ease,stroke-width .12s ease;cursor:default;}
  .donut-seg:hover{stroke-opacity:1;}
  .donut-center .dpct{font-size:26px;font-weight:800;font-family:var(--font-mono);color:var(--color-text-heading);}
  .donut-center .dlbl{font-size:10.5px;color:var(--color-text-muted);margin-top:2px;text-align:center;max-width:78px;}
  .donut-legend{flex:1;display:flex;flex-direction:column;gap:var(--sp-4);}
  .dleg-row{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--color-text-secondary);}
  .dleg-icon{width:32px;height:32px;border-radius:var(--radius-md);border:1.5px solid;display:flex;align-items:center;justify-content:center;flex:none;}
  .dleg-icon svg{width:15px;height:15px;}
  .dleg-row .dname{flex:1;color:var(--color-text-secondary);}
  .dleg-row .dcount{color:var(--color-text-secondary);font-weight:600;font-size:13.5px;min-width:64px;text-align:right;}
  .dleg-row .dpct-inline{font-weight:700;color:var(--color-text-heading);font-size:13.5px;min-width:52px;text-align:right;}

  .fmt-head-right{display:flex;align-items:center;gap:10px;}
  .fmt-total-badge{
    background:rgba(167,139,250,.22);border:1px solid rgba(167,139,250,.55);color:#e4d9ff;
    font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:var(--radius-pill);white-space:nowrap;
    box-shadow:0 0 14px -2px rgba(167,139,250,.35);
  }
  .fmt-total-badge .ad-count-link:hover{color:#fff;}
  .callout-note{margin-top:var(--sp-4);padding:10px 12px;background:rgba(118,129,245,.08);border:1px solid rgba(118,129,245,.22);border-radius:var(--radius-md);font-size:11.5px;color:var(--color-text-secondary);line-height:1.5;}
  .callout-note b{color:var(--spectrum-600);}
  .callout-note.warn{background:rgba(221,131,245,.08);border-color:rgba(221,131,245,.22);}
  .callout-note.warn b{color:var(--spectrum-400);}

  /* spend efficiency */
  .eff2-hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:var(--sp-4);}
  .eff2-herocard{border-radius:14px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;border:1px solid;}
  .eff2-herocard.risk{background:rgba(240,72,143,.08);border-color:rgba(240,72,143,.28);}
  .eff2-herocard.upside{background:rgba(124,77,238,.1);border-color:rgba(160,120,255,.28);}
  .eff2-heroicon{width:34px;height:34px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .eff2-heroicon svg{width:100%;height:100%;}
  .eff2-herocard.risk .eff2-heroicon{background:rgba(240,72,143,.18);color:#ff9cc6;}
  .eff2-herocard.upside .eff2-heroicon{background:rgba(124,77,238,.22);color:#b79cff;}
  .eff2-herotext{min-width:0;}
  .eff2-herolabel{font-size:14.5px;font-weight:700;letter-spacing:-.1px;margin-bottom:5px;color:var(--color-text-heading);}
  .eff2-heroval{font-size:21px;font-weight:700;font-family:var(--font-mono);color:var(--color-text-heading);letter-spacing:-.2px;}
  .eff2-herosub{font-size:11.5px;color:var(--color-text-muted);margin-top:3px;line-height:1.5;}

  .eff2-barwrap{margin-bottom:6px;}
  .eff2-stack{display:flex;gap:4px;height:34px;}
  .eff2-stack > div{position:relative;display:flex;align-items:center;justify-content:center;border:1px solid;border-radius:8px;min-width:0;background-image:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0) 50%);}
  .eff2-seglabel{font-size:12px;font-weight:700;white-space:nowrap;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);}

  .eff2-tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .eff2-tierline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px;}
  .eff2-tierline > div{height:3px;border-radius:2px;}
  .eff2-tier{border-radius:var(--radius-md);padding:12px 13px;border:1px solid var(--color-border-default);background:var(--color-surface-chip);}
  .eff2-tier.flag{background:rgba(240,72,143,.07);border-color:rgba(240,72,143,.3);}
  .eff2-tname{display:flex;align-items:flex-start;gap:5px;font-size:10.5px;font-weight:700;margin-bottom:8px;min-height:28px;line-height:1.35;}
  .eff2-tname .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:3px;}
  .eff2-tspend{font-size:15px;font-weight:700;font-family:var(--font-mono);color:var(--color-text-heading);}
  .eff2-tsub{font-size:10px;color:var(--color-text-faint);margin-top:3px;}
  .eff2-tsignal{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:500;font-style:italic;color:var(--color-text-subtle);margin-top:8px;line-height:1.35;cursor:default;}
  .eff2-tsignal .pip{width:5px;height:5px;border-radius:50%;background:var(--color-status-warning);opacity:.75;flex:none;}
  @media (max-width:1180px){
    .eff2-hero{grid-template-columns:1fr;}
    .eff2-tiers{grid-template-columns:repeat(2,1fr);}
    .eff2-tierline{display:none;}
  }

  .local-controls{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-5);}
  .chart-scroll{flex:1;min-height:280px;display:flex;}
  .chart-scroll .combo-svg{flex:1;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--color-text-muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}
  .legend i.line{width:14px;height:3px;border-radius:2px;}

  .hbar-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .hbar-index{width:16px;flex:none;font-size:11px;font-weight:600;color:var(--color-text-faint);font-family:var(--font-mono);text-align:right;}
  .hbar-label{width:186px;flex:none;font-size:12px;color:var(--color-text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hbar-track{flex:1;background:var(--color-surface-chip);border-radius:4px;height:16px;position:relative;overflow:hidden;}
  .hbar-fill{height:100%;border-radius:4px;}
  .hbar-value{width:76px;flex:none;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--color-text-heading);font-weight:600;}
  .hbar-sub{width:60px;flex:none;text-align:right;font-size:10.5px;color:var(--color-text-faint);font-family:var(--font-mono);}
  .hbar-spend{width:78px;flex:none;text-align:right;font-size:11px;color:var(--color-text-muted);font-family:var(--font-mono);}
  .hbar-header{display:flex;align-items:center;gap:10px;padding:0 0 8px;margin-bottom:4px;border-bottom:1px solid var(--color-border-subtle);font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--color-text-faint);}
  .hbar-header .hbar-label{color:var(--color-text-faint);}
  .hbar-header .hbar-value,.hbar-header .hbar-sub,.hbar-header .hbar-spend{font-family:inherit;font-weight:700;color:var(--color-text-faint);}

  .stage-pill-row{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;}
  .stage-pill-row::-webkit-scrollbar{display:none;height:0;}
  .stagepill{position:relative;display:inline-flex;align-items:center;gap:6px;flex:none;background:var(--color-surface-chip);border:1px solid var(--color-border-default);color:var(--color-text-secondary);font-size:12.5px;font-weight:600;font-family:inherit;padding:8px 14px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;}
  .stagepill:hover{color:var(--color-text-heading);border-color:var(--color-border-strong);}
  .stagepill.active{background:var(--gradient-primary);border-color:transparent;color:#fff;}
  .stagepill .optdot{width:5px;height:5px;border-radius:50%;background:var(--color-text-accent);display:inline-block;}
  .stagepill.active .optdot{background:rgba(255,255,255,.85);}

  .focus-panel{background:var(--color-surface-card);border:1px solid var(--color-border-purple);border-radius:var(--radius-xl);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4);}
  .focus-head{display:flex;align-items:center;gap:10px;}
  .focus-head .type-tag{font-size:10px;font-weight:600;color:var(--color-text-muted);background:var(--color-surface-chip);border-radius:5px;padding:2px 7px;}
  .focus-head b{font-family:var(--font-mono);font-size:13px;}
  .focus-head a{display:flex;align-items:center;gap:4px;color:var(--color-text-accent);font-size:11.5px;}
  .focus-head a .ic{width:11px;height:11px;}
  .focus-head .close{margin-left:auto;cursor:pointer;color:var(--color-text-faint);width:15px;height:15px;}
  .focus-head .close:hover{color:var(--color-status-error);}
  .focus-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .focus-stat{background:var(--color-surface-chip);border-radius:var(--radius-md);padding:9px 10px;}
  .focus-stat .fslabel{font-size:9.5px;color:var(--color-text-faint);font-weight:500;}
  .focus-stat .fsval{font-family:var(--font-mono);font-size:13px;font-weight:600;margin-top:4px;}
  .focus-stages{display:flex;flex-direction:column;}
  .focus-stage-row{display:flex;gap:10px;font-size:11.5px;color:var(--color-text-muted);padding:6px 0;border-bottom:1px solid var(--color-border-subtle);}
  .focus-stage-row:last-child{border-bottom:none;}
  .focus-stage-row b{color:var(--color-text-heading);font-weight:600;min-width:126px;}

  .footnote{font-size:11px;color:var(--color-text-faint);line-height:1.7;padding-top:var(--sp-5);border-top:1px solid var(--color-border-subtle);}

  /* ================= hover tooltip (for charts with small/truncated labels) ================= */
  .chart-tooltip{display:none;position:fixed;z-index:400;background:#1a1a24;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);padding:10px 12px;box-shadow:0 14px 32px rgba(0,0,0,.55);pointer-events:none;max-width:260px;overflow-wrap:anywhere;}
  .tip-title{font-size:12.5px;font-weight:700;color:var(--color-text-heading);margin-bottom:6px;overflow-wrap:anywhere;word-break:break-word;}
  .tip-row{display:flex;justify-content:space-between;gap:16px;font-size:11.5px;color:var(--color-text-muted);padding:1.5px 0;}
  .tip-row span{display:flex;align-items:center;gap:6px;}
  .tip-dot{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block;}
  .tip-row b{color:var(--color-text-heading);font-family:var(--font-mono);font-weight:600;}
  .tip-simple{font-size:12px;color:var(--color-text-secondary);line-height:1.55;max-width:220px;}

  /* ================= locked / loading state ================= */
  .load-banner{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--color-text-secondary);background:var(--color-surface-chip);border:1px solid var(--color-border-default);border-radius:var(--radius-pill);padding:8px 15px;white-space:nowrap;align-self:center;}
  .load-banner.ready{color:var(--color-status-success);border-color:rgba(62,207,142,.35);background:rgba(62,207,142,.08);}
  .load-banner .ic{width:14px;height:14px;flex:none;}
  .load-spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--color-border-strong);border-top-color:var(--color-accent);animation:cre-spin .8s linear infinite;flex:none;}

  .xselect.locked .xselect-trigger{opacity:.45;cursor:not-allowed;}
  .xselect.locked .xselect-trigger:hover{border-color:var(--color-border-default);}

  .skel{position:relative;overflow:hidden;background:var(--color-surface-chip);}
  .skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
    animation:skel-sweep 1.6s ease-in-out infinite;}
  @keyframes skel-sweep{100%{transform:translateX(100%);}}
  .ctx-loader{flex:1;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .ctx-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--color-border-default);border-top-color:var(--color-accent);animation:cre-spin .8s linear infinite;}
  .ctx-msgs{position:relative;height:20px;width:100%;text-align:center;}
  .ctx-msgs span{position:absolute;left:0;right:0;font-size:13px;font-weight:600;color:var(--color-text-secondary);opacity:0;animation:30s linear both;}
  .ctx-msgs .m1{opacity:1;animation-name:ctxM1;} .ctx-msgs .m2{animation-name:ctxM2;} .ctx-msgs .m3{animation-name:ctxM3;}
  @keyframes ctxM1{0%,30%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-6px)}}
  @keyframes ctxM2{0%,31%{opacity:0;transform:translateY(6px)}34%,63%{opacity:1;transform:none}66%,100%{opacity:0;transform:translateY(-6px)}}
  @keyframes ctxM3{0%,64%{opacity:0;transform:translateY(6px)}67%,100%{opacity:1;transform:none}}
  .ctx-steps{display:flex;gap:7px;}
  .ctx-steps i{width:7px;height:7px;border-radius:50%;background:var(--color-border-strong);animation:30s linear both;}
  .ctx-steps .s1{background:var(--color-accent);}
  .ctx-steps .s2{animation-name:ctxD2;} .ctx-steps .s3{animation-name:ctxD3;}
  @keyframes ctxD2{0%,32%{background:var(--color-border-strong)}34%,100%{background:var(--color-accent)}}
  @keyframes ctxD3{0%,65%{background:var(--color-border-strong)}67%,100%{background:var(--color-accent)}}
  .ctx-bar{width:150px;height:3px;border-radius:2px;background:var(--color-border-default);overflow:hidden;}
  .ctx-bar b{display:block;height:100%;width:0;background:var(--gradient-primary);animation:ctxBar 30s linear both;}
  @keyframes ctxBar{to{width:100%}}
  .skel-chart{display:flex;align-items:flex-end;gap:10px;height:230px;padding:10px 6px 0;}
  .skel-chart .skel{flex:1;border-radius:6px 6px 2px 2px;}
  .skel-rank-row{display:flex;align-items:center;gap:10px;padding:9px 0;}
  .skel-rank-row .skel{border-radius:4px;flex:none;height:12px;}
  .skel-rank-row .skel.grow{flex:1;height:14px;}
  [data-tip]{cursor:default;}
  .footnote b{color:var(--color-text-subtle);}

  @media (max-width:1180px){
    .summary-grid{grid-template-columns:repeat(2,1fr);}
    .row-50{grid-template-columns:1fr;}
  }
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;}
    .sidebar{display:none;}
  }

  /* ================= Insights & Actionables ================= */
  .ia-pills{display:flex;align-items:flex-end;gap:var(--sp-4);flex-wrap:wrap;margin:var(--sp-5) 0 var(--sp-4);}
  .ia-scope{display:flex;flex-direction:column;gap:var(--sp-7);}
  .ia-scope>.ia-pills{position:sticky;top:0;z-index:40;margin:0 -32px;padding:12px 32px;background:var(--color-surface-page);border-bottom:1px solid var(--color-border-subtle);}
  .ia-subpill{flex:none;display:flex;flex-direction:column;gap:6px;}
  .ia-filterlabel{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#bab7cc;}

  .insight-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .insight-top h3{margin:0;font-size:16px;font-weight:700;color:var(--color-text-heading);}
  .insight-top p{margin:3px 0 0;font-size:12px;color:var(--color-text-subtle);}
  .insight-count{font-size:11px;font-weight:700;color:var(--color-text-accent);background:var(--color-accent-soft);border:1px solid var(--color-border-purple);border-radius:var(--radius-pill);padding:4px 11px;}
  .insight-zone{position:relative;border-radius:20px;padding:16px;background:linear-gradient(160deg,rgba(150,100,255,.11),rgba(120,110,255,.055) 55%,rgba(110,130,255,.08));}
  /* one wide card per row: tinted headline panel on the left, evidence + action on the right */
  .insight-grid{display:flex;flex-direction:column;gap:12px;}
  .insight-card{display:grid;grid-template-columns:29% 1fr;position:relative;overflow:hidden;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.11);border-radius:15px;}
  .insight-card:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 55%);pointer-events:none;}
  .insight-card>*{position:relative;}
  .insight-left{padding:14px 18px;background:rgba(150,100,255,.085);border-right:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;gap:8px;justify-content:center;}
  .insight-num{font-size:24px;font-weight:800;line-height:1;color:#c9bdea;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .insight-head{font-size:15px;font-weight:700;color:#fff;line-height:1.32;}
  .insight-right{padding:13px 20px;display:flex;flex-direction:column;gap:8px;}
  .insight-para{font-size:12.5px;line-height:1.55;color:#e3e0f1;}
  .insight-para b{color:#fff;}
  .insight-lbl{font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#cdbdff;}
  .insight-todo{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 13px;display:flex;flex-direction:column;gap:2px;}
  .insight-todo .insight-txt{font-size:12.5px;font-weight:600;color:#fff;line-height:1.5;}
  .insight-actionrow{display:flex;align-items:stretch;gap:10px;}
  .insight-actionrow .insight-todo{flex:1;min-width:0;}
  .insight-cta{all:unset;box-sizing:border-box;flex:none;align-self:center;background:var(--gradient-primary);color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 18px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;box-shadow:0 3px 10px -5px rgba(173,70,255,.3), inset 0 1px 0 rgba(255,255,255,.1);transition:background .12s;}
  .insight-cta:hover{background:var(--gradient-primary-hover);}
  .insight-cta:focus-visible{background:var(--gradient-primary-focus);outline:none;}
  @media(max-width:560px){.insight-actionrow{flex-direction:column;}.insight-cta{align-self:flex-start;}}
  .insight-todo{flex-direction:row !important;align-items:center;gap:16px !important;padding:10px 12px 10px 14px !important;}
  .insight-todotxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .insight-todo .insight-cta{padding:8px 16px;}
  @media(max-width:560px){.insight-todo{flex-direction:column !important;align-items:flex-start;}}
  .insight-links{font-size:11.5px;}
  .insight-links .ad-count-link{color:#cdbdff;font-weight:600;}
  @media(max-width:760px){.insight-card{grid-template-columns:1fr;}.insight-left{border-right:none;border-bottom:1px solid rgba(255,255,255,.12);}}
  .insight-empty{padding:28px 20px;text-align:center;color:var(--color-text-faint);font-size:12.5px;background:var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-xl);}

  .combo-cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5);}
  .combo-col-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--color-text-secondary);margin-bottom:var(--sp-3);}
  .combo-col-head .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .combo-col-head.win .dot{background:var(--color-status-success);}
  .combo-col-head.lose .dot{background:var(--color-status-error);}
  .combo-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:var(--radius-lg);cursor:default;
    background:var(--color-surface-chip);border:1px solid var(--color-border-subtle);}
  .combo-row + .combo-row{margin-top:8px;}
  .combo-row:hover{border-color:var(--color-border-strong);background:var(--color-surface-chip-hover);}
  .combo-rank{width:20px;flex:none;font-size:10.5px;font-weight:700;color:var(--color-text-faint);font-family:var(--font-mono);align-self:flex-start;margin-top:2px;}
  .combo-main{flex:1;min-width:0;}
  .combo-chain{cursor:default;}
  .combo-chain-row{display:flex;align-items:baseline;gap:7px;white-space:nowrap;overflow:hidden;}
  .combo-chain-row + .combo-chain-row{margin-top:2px;}
  .combo-chain-stage{flex:none;font-size:9px;font-weight:800;letter-spacing:.4px;color:var(--spectrum-500);}
  .combo-chain-angle{font-size:13px;font-weight:700;color:var(--color-text-heading);overflow:hidden;text-overflow:ellipsis;}
  .combo-product{font-size:11px;color:var(--color-text-subtle);margin-top:5px;}
  .combo-product b{color:var(--color-text-secondary);font-weight:700;}
  .combo-sub{font-size:10.5px;color:var(--color-text-faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px;}
  .combo-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .combo-value{font-family:var(--font-mono);font-weight:700;font-size:13.5px;padding:4px 10px;border-radius:var(--radius-pill);}
  .combo-synergy{font-size:9.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;}
  .combo-synergy.up{color:var(--color-status-success);}
  .combo-synergy.down{color:var(--color-status-error);}
  .combo-synergy.flat{color:var(--color-text-faint);}
  .combo-sizepill{display:flex;flex:none;background:var(--color-surface-chip);border:1px solid var(--color-border-default);border-radius:var(--radius-pill);padding:3px;gap:2px;}
  .combo-sizebtn{all:unset;font-size:11px;font-weight:700;color:var(--color-text-muted);padding:6px 12px;border-radius:var(--radius-pill);cursor:pointer;white-space:nowrap;}
  .combo-sizebtn:hover{color:var(--color-text-secondary);}
  .combo-sizebtn.active{background:var(--gradient-primary);color:#fff;}
  .combo-controlbar{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;margin:4px 0 20px;}
  .combo-view{all:unset;display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--color-text-accent);cursor:pointer;white-space:nowrap;}
  .combo-view:hover{color:#dcc9ff;}
  .combo-view .ic{width:10px;height:10px;}
  .combo-empty{padding:16px 10px;font-size:12px;color:var(--color-text-faint);}
  .combo-footnote{margin-top:var(--sp-4);padding-top:var(--sp-3);border-top:1px solid var(--color-border-subtle);font-size:11px;color:var(--color-text-faint);}

  /* heatmap controls shared by 2D + 3D */
  .hm-controls{display:flex;flex-wrap:wrap;gap:var(--sp-4);align-items:flex-end;margin-bottom:var(--sp-3);}
  .hm-field{display:flex;flex-direction:column;gap:6px;}
  .hm-field label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--color-text-subtle);font-weight:700;}
  .hm-range{display:flex;align-items:center;gap:8px;}
  .hm-range input[type=range]{width:130px;height:22px;margin:0;accent-color:var(--color-accent);cursor:pointer;touch-action:pan-y;}
  /* ===== control bars: axis badges, taller pickers, visible Reset (option 1) ===== */
  .hm-controls{gap:16px 20px;align-items:flex-end;}
  .hm-controls .hm-field[data-axis] .xselect-trigger{height:42px;min-width:210px;padding:0 14px;gap:10px;border-radius:11px;border-color:var(--color-border-strong);font-size:13.5px;font-weight:600;transition:border-color .12s,box-shadow .12s,background .12s;}
  .hm-controls .hm-field[data-axis] .xselect-trigger:hover{border-color:var(--color-border-purple);background:#1d1c29;}

  /* 3D lab */
  .ia3d-stage{position:relative;height:620px;border-radius:var(--radius-lg);overflow:hidden;cursor:grab;
    background:
      radial-gradient(ellipse 60% 46% at 50% 34%, rgba(167,139,250,.14), transparent 62%),
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(0,0,0,.5), transparent 60%),
      var(--color-surface-card-deep);
    border:1px solid var(--color-border-default);}
  .ia3d-stage::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
    box-shadow:inset 0 0 90px rgba(0,0,0,.55);}
  .ia3d-stage.dragging{cursor:grabbing;}
  .ia3d-hint{position:absolute;top:14px;right:16px;font-size:11px;color:var(--color-text-faint);background:rgba(15,15,21,.7);border:1px solid var(--color-border-default);border-radius:999px;padding:5px 11px;pointer-events:none;z-index:3;}
  .ia3d-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:1400px;}
  .ia3d-world{position:relative;transform-style:preserve-3d;will-change:transform;}
  .ia3d-cube{position:absolute;transform-style:preserve-3d;top:0;left:0;pointer-events:auto;
    filter:drop-shadow(0 10px 12px rgba(0,0,0,.4));transition:filter .15s ease;}
  .ia3d-cube:hover{filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));}
  .ia3d-face{position:absolute;top:0;left:0;border:1px solid rgba(0,0,0,.25);border-radius:5px;overflow:hidden;}
  .ia3d-face::after{content:'';position:absolute;inset:0;pointer-events:none;}
  .ia3d-face.top{filter:brightness(1.55);}
  .ia3d-face.top::after{background:linear-gradient(135deg, rgba(255,255,255,.4), rgba(255,255,255,0) 60%);}
  .ia3d-face.front{filter:brightness(1);}
  .ia3d-face.front::after{background:linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,0) 55%, rgba(0,0,0,.08) 100%);}
  .ia3d-face.back{filter:brightness(.85);}
  .ia3d-face.right{filter:brightness(.58);}
  .ia3d-face.right::after{background:linear-gradient(135deg, rgba(255,255,255,.1), rgba(0,0,0,.18) 80%);}
  .ia3d-face.left{filter:brightness(.72);}
  .ia3d-face.left::after{background:linear-gradient(135deg, rgba(255,255,255,.14), rgba(0,0,0,.1) 80%);}
  .ia3d-face.bottom{filter:brightness(.38);}
  .ia3d-cube:hover .ia3d-face{filter:brightness(1.25) saturate(1.1);}
  .ia3d-bead.ia3d-cube, .ia3d-leader.ia3d-cube{pointer-events:none;}
  .ia3d-bead .ia3d-face{border-radius:2px;}
  .ia3d-leader .ia3d-face{opacity:.5;}
  .ia3d-glow{position:absolute;top:0;left:0;border-radius:50%;pointer-events:none;filter:blur(7px);}
  .ia3d-marker{position:absolute;top:0;left:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:3px;background:var(--color-surface-chip);border:1px dashed var(--color-border-strong);opacity:.7;}
  .ia3d-floor{position:absolute;background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 46px),
      radial-gradient(ellipse 60% 60% at 50% 50%, rgba(167,139,250,.06), transparent 70%);}
  .ia3d-label{position:absolute;top:0;left:0;pointer-events:none;white-space:nowrap;}
  .ia3d-tick{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;}
  .ia3d-tick.x{color:#c9b6ff;background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.35);}
  .ia3d-tick.y{color:#ffb3d9;background:rgba(236,72,153,.14);border:1px solid rgba(236,72,153,.35);}
  .ia3d-tick.z{color:#f6d0fb;background:rgba(240,171,252,.14);border:1px solid rgba(240,171,252,.35);}
  .ia3d-axistitle{font-size:10px;font-weight:800;letter-spacing:.12em;}
  .ia3d-axistitle.x{color:#a78bfa;} .ia3d-axistitle.y{color:#ec4899;} .ia3d-axistitle.z{color:#f0abfc;}
  .ia3d-pill{display:inline-flex;align-items:baseline;gap:5px;background:rgba(8,9,14,.85);border:1px solid rgba(255,255,255,.16);border-radius:7px;padding:3px 8px;font-size:13px;font-weight:800;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.45);}
  .ia3d-pill .n{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.55);}
  .ia3d-overlay{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:3;}
  .ia3d-overlay .legend{background:rgba(13,15,24,.8);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:8px 12px;backdrop-filter:blur(6px);}
  .ia3d-stats{font-size:11px;color:var(--color-text-muted);background:rgba(13,15,24,.8);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:8px 12px;backdrop-filter:blur(6px);}
  .ia3d-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--color-text-faint);font-size:12.5px;text-align:center;padding:30px;z-index:2;}
  .ia3d-empty b{color:var(--color-text-muted);}

    width:32px;height:32px;border-radius:var(--radius-md);flex:none;
    background:var(--color-surface-chip);border:1px solid var(--color-border-default);
    color:var(--color-text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .ads-drawer-close:hover{color:#fff;border-color:var(--color-status-error);}

  .ads-drawer-body{flex:1;display:flex;min-height:0;}
  .ads-drawer-grid{
    width:42%;flex:none;overflow-y:auto;padding:18px;
    display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:min-content;gap:12px;align-content:start;
    border-right:1px solid var(--color-border-subtle);
  }
  .ads-thumb{cursor:pointer;border-radius:var(--radius-md);overflow:hidden;border:2px solid transparent;background:var(--color-surface-card);}
  .ads-thumb:hover{border-color:var(--color-border-strong);}
  .ads-thumb.sel{border-color:var(--color-accent);}
  /* fixed px height, not aspect-ratio/padding-percent -- this grid's "auto" row
     tracks were computing to ~4px regardless of the child's actual rendered
     size when overflow:hidden sat on the row's own grid item, so a concrete
     length is what makes the row track size correctly. */
  .ads-thumb-media{position:relative;width:100%;height:140px;background:var(--color-surface-chip);}
  .ads-thumb-media img, .ads-thumb-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .ads-thumb-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none;}
  .ads-thumb-missing{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--color-text-faint);background:var(--color-surface-chip);}
  .ads-detail-missing{width:100%;height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--color-text-faint);font-size:12px;background:var(--color-surface-chip);}
  .ads-thumb-id{font-size:10px;color:var(--color-text-faint);padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .ads-drawer-detail{flex:1;overflow-y:auto;padding:20px 24px;min-width:0;}
  .ads-drawer-empty{color:var(--color-text-faint);font-size:12.5px;padding:40px;text-align:center;}
  .ads-detail-preview{position:relative;width:100%;border-radius:var(--radius-lg);overflow:hidden;background:#000;margin-bottom:14px;}
  .ads-detail-preview img, .ads-detail-preview video{width:100%;max-height:420px;object-fit:contain;display:block;background:#000;}
  .ads-detail-status{position:absolute;top:12px;left:12px;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.3px;text-transform:uppercase;}
  .ads-detail-playoverlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:background .15s ease, transform .15s ease;}
  .ads-detail-playoverlay:hover{background:rgba(0,0,0,.75);transform:translate(-50%,-50%) scale(1.06);}
  .ads-detail-status.is-active{background:rgba(62,207,142,.16);color:var(--color-status-success);border:1px solid rgba(62,207,142,.4);}
  .ads-detail-status.is-inactive{background:rgba(93,90,109,.25);color:var(--color-text-faint);border:1px solid var(--color-border-strong);}
  .ads-detail-name{font-size:14px;font-weight:700;color:var(--color-text-heading);word-break:break-all;}
  .ads-detail-meta{font-size:11.5px;color:var(--color-text-faint);margin-top:4px;margin-bottom:16px;}
  .ads-detail-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .ads-stat{background:var(--color-surface-chip);border-radius:var(--radius-md);padding:10px 12px;}
  .ads-stat span{display:block;font-size:10px;color:var(--color-text-faint);margin-bottom:4px;}
  .ads-stat b{font-family:var(--font-mono);font-size:13.5px;color:var(--color-text-heading);}
  .ads-detail-stages{display:flex;flex-direction:column;margin-bottom:16px;}
  .ads-detail-row{display:flex;gap:10px;font-size:11.5px;color:var(--color-text-muted);padding:7px 0;border-bottom:1px solid var(--color-border-subtle);}
  .ads-detail-row:last-child{border-bottom:none;}
  .ads-detail-row span{min-width:140px;flex:none;color:var(--color-text-faint);}
  .ads-detail-row b{color:var(--color-text-secondary);font-weight:600;}
  .ads-detail-link{display:inline-flex;align-items:center;gap:5px;color:var(--color-text-accent);font-size:12px;font-weight:600;}
  .ads-detail-link:hover{text-decoration:underline;}

  @media (max-width:760px){
    .ads-drawer-body{flex-direction:column;}
    .ads-drawer-grid{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--color-border-subtle);grid-template-columns:repeat(3,1fr);}
  }

  /* ================= Performance Summary v2 ================= */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);}
  .stat-card{position:relative;background-color:#1b1928;border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-xl);padding:16px 18px;display:flex;flex-direction:column;transition:border-color .15s ease;}
  .stat-card:hover{border-color:var(--color-border-strong);}
  .stat-card:nth-child(1){background-image:radial-gradient(120% 95% at 0% 0%,rgba(135,90,250,.27),transparent 62%);}
  .stat-card:nth-child(2){background-image:radial-gradient(120% 95% at 0% 0%,rgba(112,144,255,.24),transparent 62%);}
  .stat-card:nth-child(3){background-image:radial-gradient(120% 95% at 0% 0%,rgba(204,126,242,.24),transparent 62%);}
  .stat-card:nth-child(4){background-image:radial-gradient(120% 95% at 0% 0%,rgba(246,80,152,.21),transparent 62%);}
  .stat-label{font-size:12.5px;color:#c4c1d6;font-weight:500;margin-bottom:10px;}
  .stat-delta{font-size:11.5px;color:var(--color-text-muted);margin-top:8px;}
  .stat-delta b{font-weight:700;}
  .stat-delta.up b{color:#7fd9ac;} .stat-delta.down b{color:#ff9cc6;}
  /* direction-only trend line (decorative: the dataset has no dates, so it follows the placeholder delta's direction, not real daily data) */
  .stat-spark{position:absolute;top:15px;right:18px;width:42px;height:19px;opacity:.9;}
  .stat-spark.up{color:#7fd9ac;} .stat-spark.down{color:#ff9cc6;}
  .stat-value{font-size:27px;font-weight:800;font-family:var(--font-mono);color:var(--color-text-heading);letter-spacing:-.02em;}
  .stat-value .ad-count-link:hover{color:var(--color-text-accent);}
  .stat-footnote{font-size:10.5px;color:var(--color-text-faint);margin-top:10px;}

  /* ================= custom metric table ================= */
  .cmt-panel{background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0) 45%), var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-xl);box-shadow:0 20px 48px -20px rgba(0,0,0,.6);overflow:hidden;margin-bottom:28px;}
  .cmt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px 20px;padding:22px 24px 18px;flex-wrap:wrap;}
  .cmt-titlewrap{min-width:200px;flex:1;}
  .cmt-titlewrap h3{font-size:16.5px;font-weight:800;margin:0 0 4px;color:var(--color-text-heading);letter-spacing:-.1px;white-space:nowrap;}
  .cmt-titlewrap p{margin:0;font-size:12px;color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cmt-headright{display:flex;align-items:center;gap:10px;flex:none;flex-wrap:wrap;justify-content:flex-end;}

  .cmt-sw{margin-top:12px;}
  .cmt-track{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.04);border:1px solid var(--color-border-default);border-radius:10px;padding:3px;}
  .cmt-sthumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:7px;background:rgba(150,100,255,.3);border:1px solid rgba(190,170,255,.4);box-shadow:none;transition:transform .22s ease;}
  .cmt-track.story .cmt-sthumb{transform:translateX(100%);}
  .cmt-swbtn{all:unset;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--color-text-muted);font-family:inherit;font-size:12px;font-weight:600;padding:6px 16px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:color .15s;}
  .cmt-swbtn .ic{width:14px;height:14px;}
  .cmt-swbtn:hover{color:var(--color-text-secondary);}
  .cmt-swbtn.active{color:#fff;}
  .cmt-swbtn.locked{opacity:.45;cursor:not-allowed;}
  .cmt-swbtn.locked:hover{color:var(--color-text-muted);}

  .cmt-metricsbtn{all:unset;position:relative;display:flex;align-items:center;gap:7px;background:var(--gradient-primary);color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:var(--radius-pill);cursor:pointer;box-shadow:0 4px 14px -4px rgba(173,70,255,.45), inset 0 1px 0 rgba(255,255,255,.14);transition:background .12s;}
  .cmt-metricsbtn:hover{background:var(--gradient-primary-hover);}
  .cmt-metricsbtn .ic{width:14px;height:14px;}
  .cmt-metricsbtn .count{background:rgba(255,255,255,.28);border-radius:var(--radius-pill);font-size:10.5px;padding:1px 6px;}

  .cmt-controlbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:0 24px 18px;}
  .cmt-viewby{display:flex;align-items:center;gap:9px;flex:none;padding-right:16px;margin-right:2px;border-right:1px solid var(--color-border-default);}
  .cmt-viewby label{font-size:10.5px;font-weight:700;color:var(--color-text-faint);text-transform:uppercase;letter-spacing:.4px;}
  .cmt-viewby .xselect{min-width:0;}
  .cmt-viewby .xselect-trigger{padding:5px 12px;font-size:11.5px;font-weight:700;border-radius:var(--radius-pill);min-width:168px;background:rgba(255,255,255,.04);}
  .cmt-activemetrics{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:0;padding:9px 4px 9px 2px;background:transparent;}
  .cmt-activemetrics .amlabel{font-size:10.5px;font-weight:700;color:var(--color-text-faint);text-transform:uppercase;letter-spacing:.4px;flex:none;}
  .cmt-pill{display:flex;align-items:center;gap:6px;background:rgba(115,62,224,.14);border:1px solid rgba(115,62,224,.3);color:#e4d6ff;font-size:11.5px;font-weight:700;padding:5px 6px 5px 11px;border-radius:var(--radius-pill);}
  .cmt-pill button{all:unset;display:flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;color:var(--color-text-faint);cursor:pointer;}
  .cmt-pill button:hover{background:rgba(255,255,255,.1);color:var(--color-text-heading);}
  .cmt-pill button .ic{width:9px;height:9px;}

  .cmt-tablewrap{overflow-x:auto;}
  table.cmt-table{width:100%;border-collapse:collapse;min-width:760px;}
  .cmt-table thead th{background:rgba(115,62,224,.07);text-align:left;font-size:11px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.4px;padding:14px 20px 13px;border-bottom:1px solid rgba(115,62,224,.35);white-space:nowrap;}
  .cmt-table thead th.num{text-align:right;}
  .cmt-th-sort{all:unset;display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;}
  .cmt-th-sort:hover{color:var(--color-text-secondary);}
  .cmt-th-sort .ic{width:11px;height:11px;opacity:.55;}
  .cmt-th-sort.sorted .ic{opacity:1;color:var(--color-accent);}

  .cmt-table tbody tr{border-bottom:1px solid var(--color-border-default);transition:background .12s;}
  .cmt-table tbody tr:nth-child(even){background:rgba(255,255,255,.028);}
  .cmt-table tbody tr:hover{background:rgba(115,62,224,.055);}
  .cmt-table tbody tr:last-child{border-bottom:none;}
  .cmt-table td{padding:16px 20px;vertical-align:middle;}
  .cmt-table td.num{text-align:right;}
  .cmt-table td.num .val{font-family:var(--font-mono);font-weight:700;color:var(--color-text-heading);font-size:14.5px;}
  .cmt-table td.num .val.roas-val{color:var(--spectrum-300);}

  /* plain, minimal rank number, no medal coloring */
  .cmt-rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;background:var(--color-surface-chip);color:var(--color-text-subtle);font-size:11px;font-weight:800;font-family:var(--font-mono);flex:none;}

  .cmt-creative{display:flex;align-items:center;gap:12px;min-width:340px;}
  .cmt-thumb{width:44px;height:44px;border-radius:var(--radius-md);object-fit:cover;flex:none;background:var(--color-surface-chip);border:1px solid var(--color-border-strong);box-shadow:0 3px 8px -2px rgba(0,0,0,.45);}
  .cmt-thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--color-text-faint);}
  .cmt-thumb.ph .ic{width:18px;height:18px;}
  .cmt-cname{min-width:0;}
  .cmt-cname .title{position:relative;font-size:13px;font-weight:600;color:var(--color-text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;cursor:default;}
  .cmt-cmeta{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .cmt-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.2px;color:var(--color-text-subtle);}
  .cmt-preview{all:unset;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--color-text-accent);cursor:pointer;}
  .cmt-preview .ic{width:11px;height:11px;}
  .cmt-preview:hover{color:#dcc9ff;}
  .cmt-preview.disabled{color:var(--color-text-faint);cursor:not-allowed;}

  .cmt-dim{display:flex;align-items:center;gap:12px;min-width:320px;}
  .cmt-dimicon{width:38px;height:38px;border-radius:var(--radius-md);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;}
  .cmt-dname{min-width:0;}
  .cmt-dname .title{position:relative;font-size:13.5px;font-weight:700;color:var(--color-text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;cursor:default;}
  /* The CSS ::after approach (anchored via position:relative + content:attr)
     got silently clipped: .cmt-tablewrap sets overflow-x:auto, and per spec an
     element with only one overflow axis set non-visible forces the other axis
     to 'auto' too, so anything popping outside a row's box was cut off. Fixed
     via a body-level floating tooltip positioned from the hovered element's
     own rect (see wireCmtNameTooltips) instead of a pseudo-element. */
  #cmtNameTooltip{
    position:fixed;z-index:200;display:none;
    background:var(--color-surface-card-deep);color:var(--color-text-secondary);
    border:1px solid var(--color-border-strong);border-radius:9px;
    padding:9px 12px;font-size:12px;font-weight:500;line-height:1.5;
    white-space:normal;width:max-content;max-width:380px;
    box-shadow:0 16px 36px -10px rgba(0,0,0,.6);pointer-events:none;
  }
  .cmt-dmeta{display:flex;align-items:center;gap:8px;margin-top:5px;}
  .cmt-adscount{font-size:11px;color:var(--color-text-faint);font-weight:600;}
  .cmt-viewads{all:unset;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--color-text-accent);cursor:pointer;}
  .cmt-viewads .ic{width:10px;height:10px;}
  .cmt-viewads:hover{color:#dcc9ff;}

  .cmt-footbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-top:1px solid var(--color-border-default);flex-wrap:wrap;gap:6px;}
  .cmt-footnote{font-size:11.5px;color:var(--color-text-faint);}
  .cmt-footnote b{color:var(--color-text-secondary);font-weight:700;}

  .cmt-select{position:relative;}
  .cmt-dropdown{position:absolute;top:calc(100% + 10px);right:0;width:280px;background:var(--color-surface-card);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);box-shadow:0 24px 56px -16px rgba(0,0,0,.7);z-index:20;overflow:hidden;display:none;}
  .cmt-dropdown.open{display:block;}
  .cmt-ddhead{padding:16px 18px 12px;border-bottom:1px solid var(--color-border-default);}
  .cmt-ddhead h4{margin:0 0 3px;font-size:13.5px;font-weight:800;color:var(--color-text-heading);}
  .cmt-ddhead p{margin:0;font-size:11px;color:var(--color-text-muted);}
  .cmt-ddlist{max-height:320px;overflow-y:auto;padding:6px;}
  .cmt-ddrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:var(--radius-md);cursor:pointer;transition:background .12s;}
  .cmt-ddrow:hover{background:var(--color-surface-chip-hover);}
  .cmt-ddrow .lbl{font-size:12.5px;font-weight:600;color:var(--color-text-secondary);}
  .cmt-ddrow.disabled{opacity:.4;cursor:not-allowed;}
  .cmt-ddrow.disabled:hover{background:transparent;}
  .cmt-check{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--color-border-strong);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .12s;}
  .cmt-check.on{background:var(--gradient-primary);border-color:transparent;color:#fff;}
  .cmt-check .ic{width:11px;height:11px;}
  .cmt-ddtag{font-size:9px;font-weight:700;color:var(--color-text-faint);text-transform:uppercase;}

  .cmt-skel-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 18px;flex-wrap:wrap;gap:14px;}
  .cmt-skel-row{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--color-border-subtle);}
  .cmt-skel-row .skel.thumb{width:44px;height:44px;border-radius:var(--radius-md);flex:none;}
  .cmt-skel-row .skel.line{height:12px;border-radius:4px;}

  .cmt-pagination{flex-wrap:wrap;gap:10px;}
  .cmt-pagebtns{display:flex;align-items:center;gap:6px;}
  .cmt-pagebtn{all:unset;display:flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 4px;border-radius:7px;font-size:12px;font-weight:700;font-family:var(--font-mono);color:var(--color-text-secondary);background:var(--color-surface-chip);border:1px solid var(--color-border-default);cursor:pointer;box-sizing:border-box;}
  .cmt-pagebtn:hover:not(.active):not(:disabled){background:var(--color-surface-chip-hover);}
  .cmt-pagebtn.active{background:var(--gradient-primary);color:#fff;border-color:transparent;}
  .cmt-pagebtn.nav .ic{width:13px;height:13px;}
  .cmt-pagebtn:disabled{opacity:.35;cursor:not-allowed;}
  .cmt-pagebtn.ellipsis{background:transparent;border:none;cursor:default;color:var(--color-text-faint);}
  .cmt-pagination .xselect{min-width:110px;}

  /* ================= custom metric table: lightbox ================= */
  .cmt-lightbox-overlay{position:fixed;inset:0;background:rgba(6,6,10,.78);display:flex;align-items:center;justify-content:center;z-index:500;opacity:0;pointer-events:none;transition:opacity .18s;padding:32px;}
  .cmt-lightbox-overlay.open{opacity:1;pointer-events:auto;}
  .cmt-lightbox{position:relative;max-width:min(720px,100%);max-height:100%;background:var(--color-surface-card);border:1px solid var(--color-border-strong);border-radius:var(--radius-xl);padding:16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.7);}
  .cmt-lightbox-media{display:flex;align-items:center;justify-content:center;max-height:72vh;}
  .cmt-lightbox-media img, .cmt-lightbox-media video{max-width:100%;max-height:72vh;border-radius:var(--radius-lg);display:block;}
  .cmt-lightbox-name{margin-top:12px;font-size:12.5px;font-weight:600;color:var(--color-text-secondary);max-width:600px;}
  .cmt-lightbox-close{all:unset;position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;background:var(--color-surface-chip);border:1px solid var(--color-border-strong);color:var(--color-text-heading);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px -6px rgba(0,0,0,.6);}
  .cmt-lightbox-close:hover{background:var(--color-surface-chip-hover);}
  .cmt-lightbox-empty{padding:60px 40px;text-align:center;color:var(--color-text-muted);font-size:13px;}
  /* ===== Combination Lab: line / table / 3D ===== */
  .cl-panel{background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0) 45%), var(--color-surface-card);border:1px solid var(--color-border-default);border-radius:var(--radius-xl);box-shadow:0 20px 48px -20px rgba(0,0,0,.6);overflow:hidden;margin-bottom:28px;padding:22px 24px 22px;}
  .cl-head{display:flex;flex-direction:column;gap:2px;margin-bottom:16px;}
  .cl-head h3{font-size:16.5px;font-weight:800;margin:0 0 4px;color:var(--color-text-heading);letter-spacing:-.1px;}
  .cl-head p{margin:0;font-size:12px;color:var(--color-text-muted);}
  .cl-track{position:relative;display:inline-grid;grid-template-columns:repeat(2,auto);align-self:flex-start;margin-top:12px;background:rgba(255,255,255,.055);border:1px solid var(--color-border-strong);border-radius:10px;padding:3px;}
  .cl-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/2);border-radius:7px;background:rgba(150,100,255,.38);border:1px solid rgba(190,170,255,.52);box-shadow:0 2px 10px -4px rgba(150,100,255,.4);transition:transform .22s ease,width .22s ease,left .22s ease;}

  /* ================= light theme ================= */
  :root[data-theme="light"]{
    color-scheme:light;
    /* warm light palette (design-system tokens: --bg #fbf5f0, --bg-alt #f5eee9, ink #16151f, coral accent) */
    --color-surface-page:#fbf5f0; --color-surface-card:#ffffff; --color-surface-card-deep:#f5eee9;
    --color-surface-chip:#f3ece6; --color-surface-chip-hover:#ebe3dd;
    --color-text-white:#ffffff; --color-text-heading:#16151f; --color-text-secondary:rgba(22,21,31,.70); --color-text-muted:rgba(22,21,31,.55);
    --color-text-subtle:rgba(22,21,31,.50); --color-text-faint:rgba(22,21,31,.35); --color-text-accent:#d4574a;
    --color-border-default:rgba(15,15,25,.10); --color-border-subtle:rgba(15,15,25,.06); --color-border-strong:rgba(15,15,25,.15);
    --color-border-purple:#ec7c6f; --color-accent:#ec7c6f; --color-accent-soft:rgba(236,124,111,.14);
    --gradient-primary:linear-gradient(135deg,#e0604f,#e8806c,#ee9578);   /* design-system coral gradient, deepened one step so white button text stays legible */
    --gradient-primary-hover:linear-gradient(135deg,#d65646,#e0765f,#e88b6c);
    --gradient-primary-focus:linear-gradient(135deg,#cc4c3d,#d96c56,#e2805f);
    --color-status-success:#1a8f4c; --color-status-info:#3b82f6; --color-status-warning:#c9720f; --color-status-error:#d43939;
    --color-white-08:rgba(15,15,25,.05);
    --spectrum-700:#b8453a; --spectrum-650:#c9564a; --spectrum-600:#d96a5d; --spectrum-550:#ec7c6f; --spectrum-500:#ef9182; --spectrum-450:#f1a08f;

/* ===== LAB_MERGED: Experimentation Lab tab ===== */

/* ===== Experimentation Lab: six-step flow ===== */
.xl{display:flex;flex-direction:column;gap:var(--sp-6);max-width:1120px}
.xl-kicker{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--color-text-accent);text-transform:uppercase}
.xl h1{margin:4px 0 0;font-size:26px;font-weight:700;letter-spacing:-.3px;color:var(--color-text-heading)}
.xl-lede{margin:8px 0 0;max-width:680px;font-size:13.5px;line-height:1.6;color:var(--color-text-muted)}
.xl-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.xl-chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--color-border-default);background:var(--color-surface-chip);font-size:12.5px;font-weight:600;color:var(--color-text-secondary)}
.xl-chip small{font:500 11px var(--font-mono);color:var(--color-text-subtle)}
.xl-chip:hover{border-color:var(--color-border-strong);color:var(--color-text-heading)}
.xl-chip.on{background:var(--gradient-primary);border-color:transparent;color:#fff}.xl-chip.on small{color:rgba(255,255,255,.8)}
.xl-chip.off{opacity:.5;cursor:default}
.xl-preview{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;border:1px solid var(--color-border-default);background:var(--color-surface-card);border-radius:var(--radius-xl);padding:14px 18px}
.xl-preview b.big{font:700 26px var(--font-mono);color:var(--color-text-heading);letter-spacing:-.4px}
.xl-preview span{font-size:12.5px;color:var(--color-text-muted)}
.xl-preview a{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--color-text-accent);cursor:pointer}
.xl-audit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 24px;border:1px solid var(--color-border-default);background:var(--color-surface-card);border-radius:var(--radius-xl);padding:18px 20px}
.xl-audit div b{display:block;font:700 20px var(--font-mono);color:var(--color-text-heading)}
.xl-audit div span{font-size:11.5px;color:var(--color-text-subtle)}
.xl-step{display:flex;flex-direction:column;gap:14px;border:1px solid var(--color-border-default);background:var(--color-surface-card);border-radius:var(--radius-xl);padding:22px 24px}
.xl-sh{display:flex;align-items:center;gap:12px}
.xl-sn{font:700 11px var(--font-mono);letter-spacing:.4px;color:var(--color-text-accent);background:var(--color-accent-soft);border:1px solid var(--color-border-purple);border-radius:var(--radius-pill);padding:3px 11px;white-space:nowrap}
.xl-sh h2{margin:0;font-size:17px;font-weight:700;color:var(--color-text-heading);letter-spacing:-.15px}
.xl-what{margin:0;max-width:760px;font-size:13px;line-height:1.65;color:var(--color-text-muted)}
.xl-what b{color:var(--color-text-secondary);font-weight:600}
.xl-decide{display:flex;gap:12px;align-items:flex-start;border-radius:var(--radius-lg);padding:12px 16px;background:var(--color-accent-soft);border:1px solid var(--color-border-purple);font-size:12.5px;line-height:1.6;color:var(--color-text-secondary)}
.xl-decide i{flex:none;font-style:normal;font:700 10px var(--font-primary);letter-spacing:.6px;text-transform:uppercase;color:var(--color-text-accent);padding-top:3px}
.xl-decide b{color:var(--color-text-heading)}
.xl-cols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media(max-width:1000px){.xl-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.xl-cols{grid-template-columns:1fr}}
.xl-col{border:1px solid var(--color-border-default);background:var(--color-surface-card-deep);border-radius:var(--radius-lg);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.xl-col h4{margin:2px 2px 4px;font:700 10px var(--font-primary);letter-spacing:.6px;text-transform:uppercase;color:var(--color-text-subtle)}
.xl-ang{border:1px solid transparent;border-radius:var(--radius-md);padding:8px 9px;background:var(--color-surface-chip);font-size:12px;color:var(--color-text-secondary);line-height:1.35}
.xl-ang.pick{border-color:var(--color-border-purple);background:var(--color-accent-soft);color:var(--color-text-heading)}
.xl-ang b{display:block;font-weight:600;overflow-wrap:anywhere}
.xl-ang em{display:block;margin-top:3px;font:500 10.5px var(--font-mono);font-style:normal;color:var(--color-text-subtle)}
.xl-ang .tg{display:inline-block;margin-bottom:4px;font:700 9px var(--font-primary);letter-spacing:.5px;text-transform:uppercase;color:var(--color-text-accent)}
.xl-tier{display:inline-block;margin-left:6px;font:600 9.5px var(--font-primary);letter-spacing:.3px;border-radius:var(--radius-pill);padding:1px 7px;background:var(--color-surface-card);color:var(--color-text-subtle)}
.xl-tier.Strong,.xl-tier.Solid{color:var(--color-status-success)}.xl-tier.Some{color:var(--color-status-warning)}.xl-tier.Thin{color:var(--color-status-error)}
.xl-more{font-size:11px;color:var(--color-text-faint);padding:2px 4px}

.xl-hero{border-radius:var(--radius-xl);padding:24px;background:linear-gradient(160deg,var(--color-accent-soft),transparent 70%),var(--color-surface-card-deep);border:1px solid var(--color-border-purple);display:flex;flex-direction:column;gap:6px}

@keyframes zl-sh{to{background-position:-200% 0}}

.zl-lock{position:relative}

/* fixed thin gradient outline, same gradient as the CTA buttons */
.zl-hero::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;opacity:.8;
  background:var(--gradient-primary);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

.zl-lock .nm em{font:600 12px/1 var(--font-mono);font-style:normal;letter-spacing:2px;color:var(--color-text-faint);overflow:hidden;white-space:nowrap;filter:blur(.6px);user-select:none}

/* result: recipe gets the focus */
.zl-rec.focus{position:relative;border-color:transparent;box-shadow:0 22px 60px -22px rgba(173,70,255,.45),0 0 0 1px rgba(167,139,250,.08);background:linear-gradient(180deg,var(--color-accent-soft),transparent 38%),var(--color-surface-card-deep)}
.zl-rec.focus::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;background:var(--gradient-primary);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.zl-rec.focus .rc-cardhead{padding:16px 18px 12px;align-items:center}
.zl-rec.focus .rc-cardhead span:first-child{font-size:13px;letter-spacing:.5px;color:var(--color-text-heading)}
.zl-tag{font:700 10px var(--font-primary);letter-spacing:.5px;text-transform:uppercase;color:var(--color-text-accent);background:var(--color-accent-soft);border:1px solid var(--color-border-purple);border-radius:999px;padding:4px 10px}
.zl-rec.focus .rc-rn b{font-size:16.5px;line-height:1.3}

/* This static snapshot has no real per-dimension ad list (each dimension row
   is a pre-aggregated stat, not a set of ad IDs), so there is no genuine
   "first ad in this row" to read off. Until that real mapping exists, each
   dimension VALUE gets a stable, distinct rotation through the same CMT_ADS
   pool (hashed from its own label, so the same row always shows the same
   sample ad on every render) rather than every row sharing literally one
   fixed ad, which is what made every thumbnail identical before. */
function cmtHashOffset(label){
  let h = 0;
  for(let i=0;i<label.length;i++) h = (h*31 + label.charCodeAt(i)) >>> 0;
  return h % CMT_ADS.length;
}
function cmtDimSample(label, n){
  const offset = cmtHashOffset(label);
  const rotated = CMT_ADS.slice(offset).concat(CMT_ADS.slice(0, offset));
  return rotated.slice(0, Math.max(1, Math.min(n, CMT_ADS.length)));
}

const CCY = (LIVE && window.__BOOT && window.__BOOT.report && window.__BOOT.report.currency) || 'INR';
const CCY_SYM = {INR:'₹', USD:'$', EUR:'€', GBP:'£', AUD:'A$', CAD:'C$', AED:'AED ', SGD:'S$'}[CCY] || (CCY + ' ');
function fmtINR(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const abs=Math.abs(n);
  if(CCY!=='INR'){                       // international accounts: K / M units
    if(abs>=1e6) return CCY_SYM+(n/1e6).toFixed(2)+'M';
    if(abs>=1e3) return CCY_SYM+(n/1e3).toFixed(1)+'K';
    return CCY_SYM+Math.round(n);
  }
  if(abs>=1e7) return '₹'+(n/1e7).toFixed(2)+'Cr';
  if(abs>=1e5) return '₹'+(n/1e5).toFixed(2)+'L';
  if(abs>=1e3) return '₹'+(n/1e3).toFixed(1)+'K';
  return '₹'+Math.round(n);
}
function fmtNum(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Math.round(n).toLocaleString('en-IN'); }
function fmtRoas(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return n.toFixed(2)+'x'; }
function fmtPct(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return n.toFixed(1)+'%'; }
function cmtFmtValue(v, type){
  if(v===undefined||v===null||isNaN(v)) return '—';
  if(type==='inr') return fmtINR(v);
  if(type==='x') return fmtRoas(v);
  if(type==='pct') return fmtPct(v);
  if(type==='num') return fmtNum(v);
  if(type==='num2') return v.toFixed(2);
  return v;
}
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

}
function tipAttr(title, rows){ return esc(tipHtml(title, rows)); }
function tipSimple(text){ return esc(`<div class="tip-simple">${esc(text)}</div>`); }
function ensureTooltipEl(){
  let t = document.getElementById('chartTooltip');
  if(!t){ t = document.createElement('div'); t.id='chartTooltip'; t.className='chart-tooltip'; document.body.appendChild(t); }
  return t;
}
function positionTooltip(t, x, y){
  const pad=14, vw=window.innerWidth, vh=window.innerHeight;
  let left = x+pad, top = y+pad;
  t.style.left='0px'; t.style.top='0px'; t.style.display='block';
  const r = t.getBoundingClientRect();
  if(left + r.width + 8 > vw) left = x - r.width - pad;
  if(top + r.height + 8 > vh) top = y - r.height - pad;
  t.style.left = Math.max(4,left)+'px';
  t.style.top = Math.max(4,top)+'px';
}
// Hovering a ring segment swaps the centre readout to that segment's share and name.
function wireDonutHover(root){
  root.querySelectorAll('.donut-wrap').forEach(w=>{
    const pct = w.querySelector('.dpct'), lbl = w.querySelector('.dlbl');
    if(!pct || !lbl) return;
    const orig = [pct.textContent, lbl.textContent];
    w.querySelectorAll('.donut-seg').forEach(seg=>{
      seg.addEventListener('mouseenter', ()=>{ pct.textContent = seg.dataset.pct; lbl.textContent = seg.dataset.label; });
      seg.addEventListener('mouseleave', ()=>{ pct.textContent = orig[0]; lbl.textContent = orig[1]; });
    });
  });
}
function wireTooltips(root){
  const t = ensureTooltipEl();
  root.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mouseenter', e=>{ t.innerHTML = el.dataset.tip; positionTooltip(t, e.clientX, e.clientY); });
    el.addEventListener('mousemove', e=>{ positionTooltip(t, e.clientX, e.clientY); });
    el.addEventListener('mouseleave', ()=>{ t.style.display='none'; });
  });
}
function tierOf(roas){ if(roas===null||roas===undefined||isNaN(roas)) return 'unknown'; if(roas>=4) return 'excellent'; if(roas>=3) return 'good'; if(roas>=2) return 'average'; return 'poor'; }

function tierColorMono(t){ return {excellent:'var(--spectrum-700)',good:'var(--spectrum-550)',average:'var(--spectrum-400)',poor:'var(--spectrum-250)',unknown:'var(--color-text-faint)'}[t]; }
function stageLabelOf(key){ const s=STAGE_DEFS.find(s=>s.key===key); return s?s.label:key; }
