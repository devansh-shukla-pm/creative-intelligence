/* ================================================================
   INSIGHT ENGINE -- deterministic JS port of the four Creative Intel
   insight-generation prompts (see the four "Creative Intel - ... Insight
   Prompt.txt" files), the same porting approach used for the Creative
   Strategy Handover project's findDO/findSTOP/findChemistry/findTransfer.
   No LLM call -- each prompt's selection algorithm was already a precise,
   numeric, step-by-step spec, so it is ported directly rather than
   re-derived by a model per run. Every threshold below is named after the
   exact section of its source prompt so the two stay auditable side by
   side.
   ================================================================ */
function iaMedian(arr){
  if(!arr.length) return 0;
  const s = arr.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
function iaPct(v){ return (v>0 && v<1 ? v.toFixed(1) : Math.round(v)) + '%'; }
function iaPercentile(arr, p){
  if(!arr.length) return 0;
  const s = arr.slice().sort((a,b)=>a-b);
  const idx = Math.min(s.length-1, Math.max(0, Math.round(p*(s.length-1))));
  return s[idx];
}
// One row per (Stage, Angle) within `ads`, spend-weighted on the funnel/
// frequency metrics -- exactly the DATA CONTRACT shape each prompt expects.
function iaBuildStageAngleRows(ads){
  const totalSpend = ads.reduce((a,x)=>a+x.spend,0) || 0;
  const rows = [];
  STAGE_DEFS.forEach(sd=>{
    const groups = {};
    ads.forEach(ad=>{
      const angle = ad.stages[sd.key];
      if(!angle) return;
      if(!groups[angle]) groups[angle] = {stage:sd.key, stageLabel:sd.label, angle, ads:[], spend:0, revenue:0, lpvW:0, atcW:0, convW:0, freqW:0};
      const g = groups[angle];
      g.ads.push(ad); g.spend+=ad.spend; g.revenue+=ad.revenue;
      g.lpvW += ad.spend*ad.lpv_pct; g.atcW += ad.spend*ad.atc_pct; g.convW += ad.spend*ad.conv_pct; g.freqW += ad.spend*ad.frequency;
    });
    Object.values(groups).forEach(g=>{
      if(g.spend<=0) return;
      rows.push({
        stage:g.stage, stageLabel:g.stageLabel, angle:g.angle, n:g.ads.length, spend:g.spend,
        spend_share_pct: totalSpend? (g.spend/totalSpend*100) : 0,
        revenue:g.revenue, roas: g.revenue/g.spend,
        lpv_pct: g.lpvW/g.spend, atc_pct: g.atcW/g.spend, conv_pct: g.convW/g.spend, frequency: g.freqW/g.spend,
        ads: g.ads,
      });
    });
  });
  return rows;
}
function iaBaseline(ads){
  const spend = ads.reduce((a,x)=>a+x.spend,0);
  const revenue = ads.reduce((a,x)=>a+x.revenue,0);
  return {
    n: ads.length, spend, revenue, roas: spend? revenue/spend : 0,
    medianLpv: iaMedian(ads.map(a=>a.lpv_pct)),
    medianAtc: iaMedian(ads.map(a=>a.atc_pct)),
    medianConv: iaMedian(ads.map(a=>a.conv_pct)),
  };
}

/* ---- Account / Campaign DO-STOP prompts: shared selection algorithm,
   thresholds parameterized per level (see each prompt's own numbers) ---- */
function iaFindDO(rows, baseline, cfg){
  // A candidate can clear every %-based bar on a few rupees of total spend (e.g. 6 ads
  // sharing ₹224 of spend account-wide) -- the ROAS is real but there is nothing to
  // "fund properly," so it fails the prompt's own MATERIAL test even though it passes
  // the literal thresholds. A floor of "0.3% of this scope's spend" alone is still
  // scope-relative, not truly absolute -- shrink the scope (a single SKU with little
  // history, a brand-new account) and the same bug recurs at a smaller number. Also
  // require a hard currency floor that never shrinks with scope.
  const minAbsSpend = Math.max(baseline.spend * (cfg.minAbsSpendPct||0.003), 5000);
  let pool = rows.filter(r=>r.n>=cfg.minN && r.roas>=cfg.roasMult*baseline.roas && r.spend_share_pct<cfg.maxShare && r.spend>=minAbsSpend);
  let widened = false;
  if(!pool.length){
    pool = rows.filter(r=>r.n>=cfg.widenN && r.roas>=cfg.widenRoasMult*baseline.roas && r.spend_share_pct<cfg.maxShare && r.spend>=minAbsSpend);
    widened = true;
  }
  if(!pool.length) return {available:false, reason:cfg.noDoReason};
  pool.forEach(r=> r._score = ((r.roas/baseline.roas)-1) * r.n );
  pool.sort((a,b)=>b._score-a._score);
  const top = pool[0];
  return {
    available:true, stage:top.stageLabel, angle:top.angle, n:top.n, spend:top.spend, roas:top.roas,
    uplift: Math.round(((top.roas/baseline.roas)-1)*100), othersQualifying: pool.length-1, widened, ads: top.ads,
  };
}
function iaFindSTOP(rows, baseline, cfg){
  const pool = rows.filter(r=>r.spend_share_pct>=cfg.minShare);
  if(!pool.length) return {available:false, reason:cfg.noStopReason};
  const freqPeers = rows.filter(r=>r.spend_share_pct>=cfg.freqCompareShare);
  const freqP75 = iaPercentile(freqPeers.map(r=>r.frequency), 0.75);
  let candidates = freqPeers.length>1
    ? pool.filter(r=>r.frequency>=freqP75 && r.roas>=baseline.roas).map(r=>({...r, case:'fatigue'}))
    : [];
  if(!candidates.length){
    candidates = pool.map(r=>{
      if(r.lpv_pct>=baseline.medianLpv*0.98 && (r.atc_pct < baseline.medianAtc*0.85 || r.conv_pct < baseline.medianConv*0.85)){
        return {...r, case:'broken_stage', brokenField: r.atc_pct<baseline.medianAtc*0.85?'ATC':'conversion'};
      }
      if(r.atc_pct>=baseline.medianAtc*0.98 && r.lpv_pct < baseline.medianLpv*0.85){
        return {...r, case:'broken_stage', brokenField:'LPV'};
      }
      return null;
    }).filter(Boolean);
  }
  if(!candidates.length){
    candidates = pool.filter(r=>r.roas<=cfg.dragMult*baseline.roas).map(r=>({...r, case:'drag'}));
  }
  if(!candidates.length) return {available:false, reason:cfg.noStopReason};
  candidates.sort((a,b)=>b.spend_share_pct-a.spend_share_pct);
  return {available:true, ...candidates[0]};
}
const IA_ACCOUNT_DO_CFG = {minN:5, roasMult:1.2, maxShare:3, widenN:3, widenRoasMult:1.3,
  noDoReason:'No angle in this scope clears 5 ads at 1.2x baseline ROAS under 3% spend share, even after widening to 3 ads / 1.3x.'};
const IA_ACCOUNT_STOP_CFG = {minShare:15, freqCompareShare:10, dragMult:0.85,
  noStopReason:'No angle in this scope carries at least 15% of spend share, so there is nothing big enough to qualify as a STOP.'};

/* The 3rd and 4th insight slots: whichever two of these five candidate types
   are both available AND strongest in this account, ranked by a common
   "uplift-like percentage x sample size" proxy so genuinely different kinds
   of findings (a pairing, a cross-SKU gap, a debunked pooled truth, an
   Approach misallocation, a scarce-but-strong stage) can be compared on one
   scale. Debunking a false pooled "truth" gets a deliberate boost -- per the
   SKU/All-SKUs prompt, preventing a bad account-wide decision beats merely
   confirming something already assumed fine. */
function iaPooledExtraCandidates(ads, baseline){
  const candidates = [];
  const chem = iaFindStagePairing(ads, baseline);
  if(chem.available) candidates.push({tag:'CHEMISTRY', tone:'info', ico:'sparkle', find:chem, _rank: chem.uplift*chem.n});
  const transfer = iaFindAngleTransfer();
  if(transfer.available) candidates.push({tag:'WHITESPACE', tone:'warning', ico:'grid', find:transfer, _rank: transfer.upliftPct*transfer.source_n});
  const truth = iaFindPortfolioTruth();
  if(truth.available) candidates.push({tag:'PORTFOLIO TRUTH', tone: truth.verdict==='debunked'?'error':'success', ico:'refresh', find:truth, _rank: truth.pooledShare*(truth.verdict==='debunked'?25:10)});
  const approach = iaFindApproachAlignment(ads, baseline);
  if(approach.available) candidates.push({tag:'APPROACH FIT', tone:'warning', ico:'target', find:approach, _rank: ((approach.bestPerforming.roas/approach.dominant.roas)-1)*100*approach.bestPerforming.n});
  const underused = iaFindUnderusedStage(ads, baseline);
  if(underused.available) candidates.push({tag:'UNDERUSED STAGE', tone:'info', ico:'eye', find:underused, _rank: underused.uplift*underused.n});
  candidates.sort((a,b)=>b._rank-a._rank);
  return candidates.slice(0,2);
}

/* ---- SKU / All SKUs prompt: Angle Transfer + Portfolio Truth ---- */
function iaNonComboAdsForSku(skuId){
  return DATA.ads.filter(ad=>!ad.is_multi_sku && ad.skus.length===1 && ad.skus[0]===skuId);
}
function iaSkuCategory(skuId){
  const ads = iaNonComboAdsForSku(skuId);
  const counts = {};
  ads.forEach(a=>{ if(a.category) counts[a.category]=(counts[a.category]||0)+1; });
  const keys = Object.keys(counts);
  return keys.length ? keys.sort((a,b)=>counts[b]-counts[a])[0] : null;
}
/* GUARDRAIL G3 (see the Unified prompt's CATEGORY MATCH section): a shared
   Category tag proves two SKUs are broadly adjacent, it does NOT prove a
   specific angle's language transfers between them. "Direct grey hair
   problem" and Root Touch-Up Powder both sit under "hair-care" alongside
   Hair Oil -- but a hair oil doesn't treat grey hair. Keyword-match the
   angle text against a short list of condition-specific terms; if one
   hits, only SKUs actually built around that condition are eligible
   targets, category match or not. This is a heuristic (it cannot read
   intent), so it only EXCLUDES candidates it's confident about -- it
   never requires a keyword hit to let an angle through. */
const IA_CONDITION_KEYWORDS = [
  { words:['grey hair','gray hair','root touch','hair colour','hair color','hair dye'], eligibleSkus:['hair-colour-dye','root-touch-up-powder'] },
  { words:['tan removal','tan ','sun tan','post-sun','post sun'], eligibleSkus:['tan-removal'] },
  { words:['lip care','lip balm','chapped lip'], eligibleSkus:['lip-balm'] },
  { words:['night repair','nighttime skincare','overnight'], eligibleSkus:['night-repair-cream','kumkumadi-oil'] },
];
function iaAnglePlausibleForSku(angleText, skuId){
  const lower = angleText.toLowerCase();
  for(const rule of IA_CONDITION_KEYWORDS){
    if(rule.words.some(w=>lower.includes(w))){
      return rule.eligibleSkus.includes(skuId);
    }
  }
  return true; // no condition-specific keyword detected -- category match stands
}
function iaFindAngleTransfer(){
  const perSku = SKUS.map(s=>({ sku:s, ads: iaNonComboAdsForSku(s.id) }))
    .filter(p=>p.ads.length>0)
    .map(p=>({ ...p, rows: iaBuildStageAngleRows(p.ads), baseline: iaBaseline(p.ads), category: iaSkuCategory(p.sku.id) }));
  const proven = [];
  perSku.forEach(src=>{
    src.rows.forEach(r=>{
      if(r.n>=4 && r.roas>=1.2*src.baseline.roas){
        proven.push({src, row:r, upliftPct: ((r.roas/src.baseline.roas)-1)*100});
      }
    });
  });
  const pairs = [];
  proven.forEach(p=>{
    perSku.forEach(tgt=>{
      if(tgt.sku.id===p.src.sku.id) return;
      if(!tgt.category || tgt.category!==p.src.category) return;
      if(!iaAnglePlausibleForSku(p.row.angle, tgt.sku.id)) return;
      const nOnAngle = tgt.ads.filter(a=>a.stages[p.row.stage]===p.row.angle).length;
      if(nOnAngle>1) return;
      pairs.push({
        source_sku: p.src.sku.name, target_sku: tgt.sku.name, stage: p.row.stageLabel, angle: p.row.angle,
        source_n: p.row.n, source_spend: p.row.spend, source_roas: p.row.roas, upliftPct: p.upliftPct, ads: p.row.ads,
        target_total_ads: tgt.ads.length, target_n_on_angle: nOnAngle,
        frame: tgt.ads.length<8 ? 'cold_start' : 'whitespace',
      });
    });
  });
  if(!pairs.length){
    return {available:false, reason:'No proven angle (>=4 ads, >=1.2x its own SKU baseline) is both untested or barely-tested (<=1 ad) on another SKU in the same category.'};
  }
  pairs.sort((a,b)=>{
    const scoreA = a.upliftPct*a.source_n - (a.target_n_on_angle*1000);
    const scoreB = b.upliftPct*b.source_n - (b.target_n_on_angle*1000);
    return scoreB-scoreA;
  });
  return {available:true, ...pairs[0]};
}
function iaFindPortfolioTruth(){
  const allNonCombo = DATA.ads.filter(a=>!a.is_multi_sku && a.skus.length===1);
  const pooledRows = iaBuildStageAngleRows(allNonCombo);
  const topStageAngle = pooledRows.filter(r=>r.spend_share_pct>=5).sort((a,b)=>b.roas-a.roas).slice(0,3)
    .map(r=>({ type:'angle', stage:r.stageLabel, angle:r.angle, pooledRoas:r.roas, pooledShare:r.spend_share_pct,
      testIn: skuAds=>skuAds.filter(a=>a.stages[r.stage]===r.angle) }));
  const approachGroups = {};
  allNonCombo.forEach(a=>{ if(a.approach){ if(!approachGroups[a.approach]) approachGroups[a.approach]={n:0,spend:0,revenue:0}; const g=approachGroups[a.approach]; g.n++; g.spend+=a.spend; g.revenue+=a.revenue; } });
  const totalSpend = allNonCombo.reduce((a,x)=>a+x.spend,0)||1;
  const topApproach = Object.entries(approachGroups).map(([name,g])=>({name, n:g.n, spend:g.spend, roas:g.spend?g.revenue/g.spend:0, share:g.spend/totalSpend*100}))
    .filter(g=>g.share>=5).sort((a,b)=>b.roas-a.roas).slice(0,3)
    .map(g=>({ type:'approach', stage:null, angle:g.name, pooledRoas:g.roas, pooledShare:g.share,
      testIn: skuAds=>skuAds.filter(a=>a.approach===g.name) }));
  const candidates = topStageAngle.concat(topApproach);
  const confirmed = [], debunked = [];
  candidates.forEach(cand=>{
    const perSkuResults = SKUS.map(s=>{
      const skuAds = iaNonComboAdsForSku(s.id);
      if(skuAds.length<3) return null;
      const matching = cand.testIn(skuAds);
      if(matching.length<3) return null;
      const spend = matching.reduce((a,x)=>a+x.spend,0);
      const revenue = matching.reduce((a,x)=>a+x.revenue,0);
      const roas = spend? revenue/spend : 0;
      const skuBaseline = iaBaseline(skuAds);
      return { sku:s.name, roas, skuBaselineRoas: skuBaseline.roas, holds: roas>=1.1*skuBaseline.roas, spend };
    }).filter(Boolean);
    if(perSkuResults.length<1) return;
    const holdsCount = perSkuResults.filter(r=>r.holds).length;
    const testable = perSkuResults.length;
    if(holdsCount >= 0.7*testable && testable>=3){
      confirmed.push({...cand, perSkuResults, holdsCount, testable});
    } else if(holdsCount <= 0.3*testable && testable>=3){
      debunked.push({...cand, perSkuResults, holdsCount, testable});
    }
  });
  if(debunked.length){
    debunked.sort((a,b)=>b.pooledShare-a.pooledShare);
    const d = debunked[0];
    const carrying = d.perSkuResults.filter(r=>r.holds).sort((a,b)=>b.spend-a.spend).slice(0,2).map(r=>r.sku);
    return {available:true, verdict:'debunked', type:d.type, label:d.angle, stage:d.stage, pooledRoas:d.pooledRoas, pooledShare:d.pooledShare,
      holdsCount:d.holdsCount, testable:d.testable, carrying};
  }
  if(confirmed.length){
    confirmed.sort((a,b)=>b.pooledShare-a.pooledShare);
    const c = confirmed[0];
    return {available:true, verdict:'confirmed', type:c.type, label:c.angle, stage:c.stage, pooledRoas:c.pooledRoas, pooledShare:c.pooledShare,
      holdsCount:c.holdsCount, testable:c.testable};
  }
  return {available:false, reason:'No top-3 pooled pattern (>=5% spend share) clears a clean 70% confirm or 30% debunk bar once checked SKU by SKU -- results are too mixed for either verdict.'};
}

/* ---- SKU / Specific SKU prompt: Stage-Pairing Chemistry, Approach
   Alignment, Underused Stage ---- */
function iaFindStagePairing(skuAds, skuBaseline){
  const soloRows = iaBuildStageAngleRows(skuAds);
  const soloLookup = {};
  soloRows.forEach(r=>{ soloLookup[r.stage+'|'+r.angle] = r.roas; });
  const totalSpend = skuAds.reduce((a,x)=>a+x.spend,0)||1;
  const pairGroups = {};
  for(let i=0;i<STAGE_DEFS.length;i++){
    for(let j=i+1;j<STAGE_DEFS.length;j++){
      const sa = STAGE_DEFS[i].key, sb = STAGE_DEFS[j].key;
      skuAds.forEach(ad=>{
        const va = ad.stages[sa], vb = ad.stages[sb];
        if(!va || !vb) return;
        const key = sa+'='+va+'|'+sb+'='+vb;
        if(!pairGroups[key]) pairGroups[key] = {stageA:STAGE_DEFS[i].label, angleA:va, keyA:sa+'|'+va, stageB:STAGE_DEFS[j].label, angleB:vb, keyB:sb+'|'+vb, n:0, spend:0, revenue:0, ads:[]};
        const g = pairGroups[key];
        g.n++; g.spend+=ad.spend; g.revenue+=ad.revenue; g.ads.push(ad);
      });
    }
  }
  // 0.3% of total spend, not 3% -- a two-dimensional pairing spreads the same
  // spend thinner than a single angle does, so a %-floor sized for a single
  // SKU's spend (the original per-SKU design) silently kills this entire
  // candidate type once it runs pooled account-wide instead. Verified: at a
  // 3% floor this returned zero candidates on a real 288-ad account; at 0.3%
  // (the same absolute bar G2/DO already uses) it surfaced 4 genuine ones.
  let pairs = Object.values(pairGroups).filter(g=>g.n>=4 && (g.spend/totalSpend*100)>=0.3);
  pairs = pairs.map(g=>{
    const soloA = soloLookup[g.keyA]||0, soloB = soloLookup[g.keyB]||0;
    const expected = Math.max(soloA, soloB);
    return {...g, pairRoas: g.spend? g.revenue/g.spend : 0, expected, soloA, soloB};
  }).filter(g=>g.expected>0);
  let qualifying = pairs.filter(g=>g.pairRoas>=1.25*g.expected);
  if(!qualifying.length) qualifying = pairs.filter(g=>g.pairRoas>=1.15*g.expected);
  if(!qualifying.length) return {available:false, reason:'No co-occurring stage pair in this scope (n>=4, >=3% of scope spend) beats the stronger of its two solo averages by at least 15%.'};
  qualifying.forEach(g=> g._score = (g.pairRoas/g.expected - 1)*g.n );
  qualifying.sort((a,b)=>b._score-a._score);
  const top = qualifying[0];
  return {available:true, stageA:top.stageA, angleA:top.angleA, stageB:top.stageB, angleB:top.angleB,
    n:top.n, spend:top.spend, pairRoas:top.pairRoas, soloA:top.soloA, soloB:top.soloB, ads:top.ads,
    uplift: Math.round((top.pairRoas/top.expected-1)*100)};
}
function iaFindApproachAlignment(skuAds, skuBaseline){
  const groups = {};
  skuAds.forEach(a=>{ if(!a.approach) return; if(!groups[a.approach]) groups[a.approach]={n:0,spend:0,revenue:0,ads:[]}; const g=groups[a.approach]; g.n++; g.spend+=a.spend; g.revenue+=a.revenue; g.ads.push(a); });
  const totalSpend = skuAds.reduce((a,x)=>a+x.spend,0)||1;
  const rows = Object.entries(groups).map(([name,g])=>({name, n:g.n, spend:g.spend, share:g.spend/totalSpend*100, roas:g.spend?g.revenue/g.spend:0, ads:g.ads}));
  if(!rows.length) return {available:false, reason:'No ad in this scope carries an Approach tag.'};
  const dominant = rows.slice().sort((a,b)=>b.share-a.share)[0];
  const withSample = rows.filter(r=>r.n>=4);
  if(!withSample.length) return {available:false, reason:'No Approach in this scope has 4 or more ads, so there is no reliable best-performer to compare against the dominant Approach.'};
  const bestPerforming = withSample.slice().sort((a,b)=>b.roas-a.roas)[0];
  if(bestPerforming.name===dominant.name) return {available:false, reason:'This scope\'s biggest Approach by spend is also its best-performing Approach -- no misallocation to report.'};
  if(!(dominant.share>=40 && bestPerforming.roas>=1.3*dominant.roas)){
    return {available:false, reason:`Dominant Approach share (${iaPct(dominant.share)}) or the performance gap doesn't clear the 40% share / 1.3x materiality bar.`};
  }
  return {available:true, dominant, bestPerforming};
}
function iaFindUnderusedStage(skuAds, skuBaseline){
  const total = skuAds.length||1;
  const candidates = STAGE_DEFS.map(sd=>{
    const populating = skuAds.filter(a=>a.stages[sd.key]);
    const presencePct = populating.length/total*100;
    if(presencePct>15 || populating.length<2) return null;
    const spend = populating.reduce((a,x)=>a+x.spend,0);
    const revenue = populating.reduce((a,x)=>a+x.revenue,0);
    const roas = spend? revenue/spend : 0;
    if(roas < 1.3*skuBaseline.roas) return null;
    return {stage:sd.label, n:populating.length, total, presencePct, roas, ads:populating, uplift: Math.round((roas/skuBaseline.roas-1)*100)};
  }).filter(Boolean);
  if(!candidates.length) return {available:false, reason:'No stage used in 15% or fewer of this scope\'s ads (with at least 2 ads populating it) beats this scope\'s baseline by 1.3x.'};
  candidates.sort((a,b)=> b.uplift-a.uplift || a.n-b.n);
  return {available:true, ...candidates[0]};
}

/* ---- dispatcher: always account-wide/pooled, always aims for 4 cards --
   DO + STOP (the two highest-value, most-requested types) plus whichever two
   of the other five candidate types are strongest right now. Never filtered
   by the campaign/SKU bar below -- that bar scopes the combo table and both
   heatmaps only. */
function iaComputeCards(){
  const ads = DATA.ads;
  const rows = iaBuildStageAngleRows(ads);
  const baseline = iaBaseline(ads);
  const doFind = iaFindDO(rows, baseline, IA_ACCOUNT_DO_CFG);
  const stopFind = iaFindSTOP(rows, baseline, IA_ACCOUNT_STOP_CFG);
  const extra = iaPooledExtraCandidates(ads, baseline);
  return [
    {tag:'DO', tone:'success', ico:'trending', find:doFind},
    {tag:'STOP', tone:'error', ico:'bell', find:stopFind},
    ...extra,
  ];
}

/* ---- render: turns a card's {tag, tone, ico, find} into the headline /
   evidence / why / action copy, per each source prompt's OUTPUT FORMAT ---- */
function iaAdsLink(ads, label){
  return `<span class="ad-count-link" data-ad-ids="${adsIdsAttr(ads)}" data-filter-label="${esc(label)}">${fmtNum(ads.length)} ad${ads.length===1?'':'s'}</span>`;
}
/* Copy is deliberately compressed to 3 pieces (headline, one-breath body,
   one-line action) instead of the earlier 4-part evidence/why/action split --
   the underlying selection logic (and its materiality bar) is unchanged, only
   the output shape is simpler to scan. The headline must still be a critical,
   non-obvious claim -- never a restated fact -- per the source prompts'
   Obviousness Filter; "easy to read" governs the PRESENTATION, not the bar
   for which finding gets surfaced. */
/* Fixed, exact glosses -- a reader who has never seen this product's
   taxonomy before must still understand every card. "Push Product" or
   "Hook Line" mean nothing in isolation; always weave their plain-
   language meaning into the sentence, never leave a taxonomy name bare. */
const IA_STAGE_GLOSS = {
  'Problem Statement':'the problem it opens with', 'Hook Line':'the opening hook',
  'Primary USP Claim':'the core claim it\'s proving', 'Use Case Scenario':'the context it\'s shown in',
  'CTA Text':'how it closes', 'Testimonial Claim':'the testimonial it uses',
  'Proof Points':'the proof it cites', 'Credibility Signal':'the credibility signal it leans on',
  'Offer Details':'the offer or promo it\'s running', 'Comparison Axis':'what it\'s comparing itself against',
};
const IA_APPROACH_GLOSS = {
  'Push Product':'leads with the product itself', 'Push Problem':'leads with the problem it solves',
  'Push Differentiation':'leads with what makes it different', 'Push Brand':'leads with brand trust and credibility',
  'Push Offer':'leads with a deal or promotion',
};
function iaStageGloss(stage){ return IA_STAGE_GLOSS[stage] || stage.toLowerCase(); }
function iaApproachPhrase(name){ return `the pitch that ${IA_APPROACH_GLOSS[name]||'runs as '+name} (${name})`; }
function iaCardCopy(tag, find){
  if(!find.available) return null;
  if(tag==='DO'){
    return {
      head:`"${find.angle}" is quietly outperforming by ${find.uplift}% -- and barely funded`,
      body:`${iaAdsLink(find.ads, find.stage+': '+find.angle)} on ${iaStageGloss(find.stage)}, <b>${fmtRoas(find.roas)} ROAS</b> vs this account's average. A proven angle pulling this little budget is a funding gap, not a performance problem.`,
      action:`Brief more creatives using this angle for ${iaStageGloss(find.stage)} and fund it properly.`,
    };
  }
  if(tag==='STOP'){
    const gloss = iaStageGloss(find.stageLabel);
    if(find.case==='fatigue'){
      return {
        head:`"${find.angle}" is fatiguing while it still looks fine`,
        body:`${iaAdsLink(find.ads, find.stageLabel+': '+find.angle)} on ${gloss}, ${iaPct(find.spend_share_pct)} of spend -- frequency is already climbing, and that happens before ROAS visibly drops, not after.`,
        action:`Refresh the creative behind this angle now, before the dip shows up.`,
      };
    }
    if(find.case==='broken_stage'){
      const lowATC = find.brokenField!=='LPV';
      return {
        head: lowATC ? `"${find.angle}" earns the view, then loses the sale` : `"${find.angle}" never earns the view in the first place`,
        body: lowATC
          ? `${iaAdsLink(find.ads, find.stageLabel+': '+find.angle)} on ${gloss}, ${iaPct(find.spend_share_pct)} of spend -- strong on landing-page views, weak on add-to-cart. The hook works; whatever comes right after it doesn't.`
          : `${iaAdsLink(find.ads, find.stageLabel+': '+find.angle)} on ${gloss}, ${iaPct(find.spend_share_pct)} of spend -- add-to-cart is fine once people click, but almost nobody clicks.`,
        action: lowATC ? `Keep this angle, test a stronger core claim or offer behind it.` : `Keep the offer, refresh the opening hook driving people to it.`,
      };
    }
    return {
      head:`"${find.angle}" is dragging on the account`,
      body:`${iaAdsLink(find.ads, find.stageLabel+': '+find.angle)} on ${gloss}, ${iaPct(find.spend_share_pct)} of spend, running well below the account's own average.`,
      action:`Cut new spend into this angle until it recovers.`,
    };
  }
  if(tag==='WHITESPACE'){
    return {
      head:`"${find.angle}" is proven on ${find.source_sku} -- and untouched on ${find.target_sku}`,
      body:`${iaAdsLink(find.ads, find.stage+': '+find.angle)} -- ${iaStageGloss(find.stage)} on ${find.source_sku} -- runs at <b>${fmtRoas(find.source_roas)} ROAS</b> (+${Math.round(find.upliftPct)}% vs its own baseline). ${find.target_sku} has ${fmtNum(find.target_total_ads)} ads on record and ${find.target_n_on_angle===0?'has never run this angle':`only ${find.target_n_on_angle} ad on it`}.`,
      action:`Brief 2-3 ${find.target_sku} creatives using this same angle before testing anything unproven.`,
    };
  }
  if(tag==='PORTFOLIO TRUTH'){
    const isApproach = find.type==='approach';
    const who = isApproach ? `Ads that ${IA_APPROACH_GLOSS[find.label]||'use the '+find.label+' pitch'}` : `The "${find.label}" angle`;
    const whoLower = isApproach ? 'these ads' : 'this angle';
    const carriers = find.carrying && find.carrying.length ? find.carrying.join(' and ') : null;
    const others = find.testable - find.holdsCount;
    if(find.verdict==='debunked'){
      return {
        head:`${who} only really work for ${find.holdsCount} of ${find.testable} products`,
        body:`Across the whole account ${whoLower} average <b>${fmtRoas(find.pooledRoas)} ROAS</b>, which looks strong. But that number is carried by ${carriers||'a single product'}. For the other ${others} product${others===1?'':'s'}, it doesn't hold up.`,
        action:`Don't use this everywhere. Keep it for ${carriers||'the product where it works'} and try something different on the rest.`,
      };
    }
    return {
      head:`${who} work well across products, not just one`,
      body:`${isApproach?'They':'It'} average <b>${fmtRoas(find.pooledRoas)} ROAS</b> overall, and that holds up in ${find.holdsCount} of ${find.testable} products tested, so it isn't a one-product fluke.`,
      action:`Try ${whoLower} on the products that haven't used ${isApproach?'them':'it'} yet.`,
    };
  }
  if(tag==='CHEMISTRY'){
    return {
      head:`"${find.angleA}" + "${find.angleB}" together beat what either does alone`,
      body:`${iaAdsLink(find.ads, find.stageA+': '+find.angleA+' + '+find.stageB+': '+find.angleB)} -- pairing ${iaStageGloss(find.stageA)} with ${iaStageGloss(find.stageB)} -- runs <b>${fmtRoas(find.pairRoas)} ROAS</b> together, ${find.uplift}% above the stronger solo average (${fmtRoas(find.soloA)} / ${fmtRoas(find.soloB)}).`,
      action:`Brief more creatives explicitly pairing these two.`,
    };
  }
  if(tag==='APPROACH FIT'){
    return {
      head:`One default pitch eats the budget -- a smaller one converts better`,
      body:`${iaApproachPhrase(find.dominant.name)}: ${iaPct(find.dominant.share)} of spend, ${fmtRoas(find.dominant.roas)} ROAS. ${iaApproachPhrase(find.bestPerforming.name)}: ${iaAdsLink(find.bestPerforming.ads, find.bestPerforming.name)}, only ${iaPct(find.bestPerforming.share)} of spend, <b>${fmtRoas(find.bestPerforming.roas)} ROAS</b>.`,
      action:`Shift real budget from the ${find.dominant.name.toLowerCase()} pitch into the ${find.bestPerforming.name.toLowerCase()} one.`,
    };
  }
  if(tag==='UNDERUSED STAGE'){
    const gloss = iaStageGloss(find.stage);
    return {
      head:`${find.stage} (${gloss}) is barely tested -- and wins when it is`,
      body:`Only ${iaAdsLink(find.ads, find.stage)} of ${fmtNum(find.total)} ads even set ${gloss}, but those that do run <b>${fmtRoas(find.roas)} ROAS</b> (+${find.uplift}% vs baseline).`,
      action:`Brief a few more ads that set ${gloss} to confirm the signal.`,
    };
  }
  return null;
}

/* ---- winning / losing combinations ----
   Size 1 is the original (Stage, Angle) view. Sizes 2-4 port the "Top
   Combinations" feature from the Creative Strategy Handover build: search
   every subset of that many MANDATORY stages (conditional stages are too
   sparse to combine reliably), pool every resulting combination across all
   those stage-subsets into one ranked list (no manual stage picking -- the
   point is discovering which stages pair well, not confirming one you
   already chose), and score each by Synergy: actual ROAS vs. an "expected"
   ROAS built by multiplying the baseline by each component's own solo
   uplift. Synergy >=1.1x means the combination beats what its parts would
   predict alone; <0.95x means it underperforms that expectation. */
const IA_MANDATORY_STAGE_KEYS = STAGE_DEFS.filter(s=>s.mandatory).map(s=>s.key);
function iaTopSkuLabel(ads){
  const counts = {};
  ads.forEach(ad=>{ const sl=iaSkuLabelOf(ad); counts[sl]=(counts[sl]||0)+1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
}
function iaComboRowsSize1(ads, minAds, minSpend){
  const rows = [];
  STAGE_DEFS.forEach(sd=>{
    const groups = {};
    ads.forEach(ad=>{
      const angle = ad.stages[sd.key];
      if(!angle) return;
      if(!groups[angle]) groups[angle] = {stageLabel:sd.label, angle, n:0, spend:0, revenue:0, ads:[]};
      const g = groups[angle];
      g.n++; g.spend+=ad.spend; g.revenue+=ad.revenue; g.ads.push(ad);
    });
    Object.values(groups).forEach(g=>{
      if(g.n<minAds || g.spend<=0 || g.spend<minSpend) return;
      rows.push({chain:[{stageLabel:g.stageLabel, angle:g.angle}], n:g.n, spend:g.spend, roas:g.revenue/g.spend, synergy:null, topSku:iaTopSkuLabel(g.ads), ads:g.ads});
    });
  });
  return rows;
}
function iaSoloStatsForStage(ads, stageKey){
  const groups = {};
  ads.forEach(ad=>{ const v=ad.stages[stageKey]; if(!v) return; (groups[v]=groups[v]||[]).push(ad); });
  const out = {};
  Object.entries(groups).forEach(([val,list])=>{
    const spend=list.reduce((a,x)=>a+x.spend,0), revenue=list.reduce((a,x)=>a+x.revenue,0);
    out[val] = {n:list.length, roas: spend? revenue/spend : 0};
  });
  return out;
}
function iaComboStatsForStageSet(ads, baselineRoas, stageKeys, minAds, minSpend){
  const solo = {}; stageKeys.forEach(k=> solo[k]=iaSoloStatsForStage(ads,k));
  const groups = {};
  ads.forEach(ad=>{
    const vals = stageKeys.map(k=>ad.stages[k]);
    if(vals.some(v=>!v)) return;
    const key = vals.join(' || ');
    if(!groups[key]) groups[key] = {stageKeys, values:vals, ads:[]};
    groups[key].ads.push(ad);
  });
  return Object.values(groups).map(g=>{
    const spend = g.ads.reduce((a,x)=>a+x.spend,0);
    const revenue = g.ads.reduce((a,x)=>a+x.revenue,0);
    const n = g.ads.length;
    if(n<minAds || spend<=0 || spend<minSpend) return null;
    const roas = revenue/spend;
    let expected = baselineRoas;
    g.stageKeys.forEach((k,i)=>{ const so=solo[k][g.values[i]]; if(so && baselineRoas>0) expected *= (so.roas/baselineRoas); });
    const chain = g.stageKeys.map((k,i)=>({stageLabel: STAGE_DEFS.find(s=>s.key===k).label, angle:g.values[i]}));
    return { chain, n, spend, roas, synergy: expected>0? roas/expected : null, topSku:iaTopSkuLabel(g.ads), ads:g.ads };
  }).filter(Boolean);
}
function iaComboRowsSizeN(ads, size, minAds, minSpend){
  const baseline = iaBaseline(ads);
  const keys = IA_MANDATORY_STAGE_KEYS;
  const out = [];
  (function pick(start, chosen){
    if(chosen.length===size){
      out.push(...iaComboStatsForStageSet(ads, baseline.roas, chosen.map(i=>keys[i]), minAds, minSpend));
      return;
    }
    for(let i=start;i<keys.length;i++) pick(i+1, [...chosen,i]);
  })(0, []);
  return out;
}
function iaComboRowsForSize(ads, size, minAds, minSpend){
  return size<=1 ? iaComboRowsSize1(ads, minAds, minSpend) : iaComboRowsSizeN(ads, size, minAds, minSpend);
}
function renderIaComboRow(r, rank, prefix, color, textColor){
  const chainHtml = r.chain.map(c=>`<div class="combo-chain-row"><span class="combo-chain-stage">${esc(c.stageLabel.toUpperCase())}</span><span class="combo-chain-angle">${esc(c.angle)}</span></div>`).join('');
  const label = r.chain.map(c=>`${c.stageLabel}: ${c.angle}`).join(' + ');
  const tipRows = r.chain.map(c=>[c.stageLabel, c.angle]).concat([['Product',r.topSku],['Ads',fmtNum(r.n)],['Spend',fmtINR(r.spend)],['ROAS',fmtRoas(r.roas)]]);
  if(r.synergy!=null) tipRows.push(['Synergy', r.synergy.toFixed(2)+'x']);
  const synergyBadge = r.synergy==null ? '' : (()=>{
    const cls = r.synergy>=1.1 ? 'up' : (r.synergy<0.95 ? 'down' : 'flat');

  </div>`;
}
function renderIaComboTable(ads){

  const losing = rows.slice().sort((a,b)=>a.roas-b.roas).slice(0,5);
  const shown = winning.concat(losing);
  const [minRoas, maxRoas] = iaRobustDomain(shown.map(r=>r.roas));

}

/* ---- shared: continuous heat color, scaled to what's actually on screen ----
   A flat 4-bucket tier color made every mid-pack cell look identical. This
   interpolates smoothly across the app's own error -> warning -> success
   hues (skipping "good" blue, which breaks a clean warm-to-cool ramp) between
   whatever min/max ROAS is actually visible in the current view. */
const IA_HEAT_STOPS = [
  [0.00, [248,239,255]],   // spectrum-150, lightest -- worst ROAS
  [0.50, [221,131,245]],   // spectrum-400, mid
  [1.00, [115,62,224]],    // spectrum-700, darkest -- best ROAS
];
const IA_HEAT_STOPS_LIGHT = [[0.00,[253,241,236]],[0.50,[242,169,142]],[1.00,[184,69,58]]];   // warm theme: cream -> peach -> deep coral
function iaHeatRGB(t){
  t = Math.max(0, Math.min(1, t));
  const STOPS = __lt() ? IA_HEAT_STOPS_LIGHT : IA_HEAT_STOPS;
  for(let i=0;i<STOPS.length-1;i++){
    const a=STOPS[i], b=STOPS[i+1];
    if(t>=a[0] && t<=b[0]){
      const lt=(t-a[0])/((b[0]-a[0])||1);
      const r=Math.round(a[1][0]+(b[1][0]-a[1][0])*lt);
      const g=Math.round(a[1][1]+(b[1][1]-a[1][1])*lt);
      const bl=Math.round(a[1][2]+(b[1][2]-a[1][2])*lt);
      return `rgb(${r},${g},${bl})`;
    }
  }
  return 'rgb(62,207,142)';
}
function iaToRGBA(rgbStr, alpha){
  const m = rgbStr.match(/rgb\(([^)]+)\)/);
  return m ? `rgba(${m[1]},${alpha})` : rgbStr;
}
// Heatmap cells sit at this alpha instead of fully opaque -- a flat, fully
// saturated fill on every cell read as too loud/striking against the dark
// panel behind it. Letting the panel ground show through gives the grid a
// softer, glass-like finish without losing the color ramp's meaning.
const IA_HEAT_CELL_ALPHA = 0.72;
// The color actually rendered on screen is this alpha blended over the
// panel's own background, not the raw opaque ramp color -- card background
// is a dark purple-black (#1a1826), so at <1 alpha every cell reads darker
// than its nominal hex. Text-contrast decisions (and anything else that
// cares what color a cell actually LOOKS like) should blend against that
// ground first, otherwise a cell near the light end of the ramp can still
// get dark text even though, once blended with the dark panel behind it,
// it's no longer light enough for dark text to read clearly.
const IA_HEAT_CARD_BG = [26,24,38];
function iaBlendOverCard(r,g,b,alpha){
  return [
    Math.round(r*alpha + IA_HEAT_CARD_BG[0]*(1-alpha)),
    Math.round(g*alpha + IA_HEAT_CARD_BG[1]*(1-alpha)),
    Math.round(b*alpha + IA_HEAT_CARD_BG[2]*(1-alpha)),
  ];
}
// The monochrome purple ramp runs from near-white (worst) to a deep, dark
// purple (best) -- a single hardcoded text color would be unreadable at one
// end or the other, so pick dark/light text from the cell's own (blended,
// on-screen) luminance.
function iaReadableTextColor(colorStr){
  const m = colorStr.match(/rgba?\(([^)]+)\)/);
  if(!m) return '#fff';
  const parts = m[1].split(',').map(Number);
  const alpha = parts.length>3 ? parts[3] : 1;
  const [r,g,b] = iaBlendOverCard(parts[0], parts[1], parts[2], alpha);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.6 ? (__lt() ? '#4a1c14' : '#3a1d6e') : '#fff';
}
function iaRangeHeatColor(roas, minRoas, maxRoas){
  const t = maxRoas>minRoas ? (roas-minRoas)/(maxRoas-minRoas) : 0.72;
  return iaToRGBA(iaHeatRGB(t), IA_HEAT_CELL_ALPHA);
}
// A single freak cell (near-zero spend, wild ROAS) can blow the domain out so
// far every normal cell compresses to one end of the gradient. Clip the
// coloring domain to the 10th-90th percentile of what's actually on screen;
// individual cells outside that range still get a real (clamped) color.
function iaRobustDomain(values){
  if(!values.length) return [0,1];
  const sorted = values.slice().sort((a,b)=>a-b);
  const pct = p => sorted[Math.min(sorted.length-1, Math.max(0, Math.round(p*(sorted.length-1))))];
  let lo = pct(0.1), hi = pct(0.9);
  if(hi<=lo){ lo = sorted[0]; hi = sorted[sorted.length-1]; }
  if(hi<=lo){ hi = lo+1; }
  return [lo, hi];
}
function iaHeatColor(roas){ return tierColor(tierOf(roas)); }

/* ---- 2D heatmap ---- */
const IA_QUICK_VIEWS_2D = [
  {label:'Hook × USP', x:'hook-line', y:'primary-usp-claim'},
  {label:'Problem × USP', x:'problem-statement', y:'primary-usp-claim'},
  {label:'USP × CTA', x:'primary-usp-claim', y:'cta-text'},
  {label:'Testimonial × Proof', x:'testimonial-claim', y:'proof-points'},
];
function ia2dTopAngles(ads, stageKey, k){
  const counts = {};
  ads.forEach(ad=>{ const v=ad.stages[stageKey]; if(v) counts[v]=(counts[v]||0)+1; });
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,k);
}
/* ---- slider smoothness ----
   Dragging a slider used to rebuild its whole panel on every tick, INCLUDING the
   slider itself, so the browser lost the drag mid-gesture (the jitter). Now the
   controls element stays put in the DOM and only the content around it is
   swapped; the number beside the slider updates instantly, and heavier redraws
   are paced to one per animation frame (or debounced for the 3D scene). */
function hmSoftSwap(oldC, newC, keepSel){
  const oldKeep = oldC.querySelector(':scope > '+keepSel), newKeep = newC.querySelector(':scope > '+keepSel);
  if(!oldKeep || !newKeep){ oldC.innerHTML = newC.innerHTML; return false; }
  const newLabels = newKeep.querySelectorAll('.hm-range .tabnum');
  oldKeep.querySelectorAll('.hm-range .tabnum').forEach((el,i)=>{ if(newLabels[i]) el.textContent = newLabels[i].textContent; });
  const kids = Array.from(newC.childNodes), idx = kids.indexOf(newKeep);
  Array.from(oldC.childNodes).forEach(n=>{ if(n!==oldKeep) n.remove(); });
  kids.slice(0, idx).forEach(n=>oldC.insertBefore(n, oldKeep));
  kids.slice(idx+1).forEach(n=>oldC.appendChild(n));
  return true;
}
function hmSliderLabel(input, text){
  const lbl = input.parentElement && input.parentElement.querySelector('.tabnum');
  if(lbl) lbl.textContent = text;
}
function hmFrame(fn){
  let raf = 0;
  return ()=>{ if(!raf) raf = requestAnimationFrame(()=>{ raf = 0; fn(); }); };
}
function hmDebounce(fn, ms){
  let t = 0;
  return ()=>{ clearTimeout(t); t = setTimeout(fn, ms); };
}

function renderIaHeatmap2DShell(){
  return `<div class="panel">
    <div class="panel-head">
      <div><h3>2D Combination Heatmap</h3><p>ROAS performance of any two creative stage combinations.</p></div>
    </div>
    <div id="ia2dRoot"></div>
  </div>`;
}
function mountIaHeatmap2D(){
  const root = document.getElementById('ia2dRoot');
  if(!root) return;
  const st = { x:'hook-line', y:'primary-usp-claim', minAds:2, minSpend:0 };
  function draw(soft){
    const ads = iaFilteredAds();
    const xs = ia2dTopAngles(ads, st.x, 6);
    const ys = ia2dTopAngles(ads, st.y, 6);
    const cellMap = {};
    ads.forEach(ad=>{
      const vx = ad.stages[st.x], vy = ad.stages[st.y];
      if(!vx || !vy) return;
      if(xs.indexOf(vx)<0 || ys.indexOf(vy)<0) return;
      const key = vx+'|'+vy;
      if(!cellMap[key]) cellMap[key]={n:0,spend:0,revenue:0,ads:[]};
      cellMap[key].n++; cellMap[key].spend+=ad.spend; cellMap[key].revenue+=ad.revenue; cellMap[key].ads.push(ad);
    });
    const stageOpts = STAGE_DEFS.map(s=>({value:s.key,label:s.label}));

    // resolve every cell's ROAS + sufficiency once, so color can scale to
    // the actual min/max on screen instead of fixed absolute buckets
    Object.keys(cellMap).forEach(k=>{
      const c = cellMap[k];
      c.roas = c.spend? c.revenue/c.spend : 0;
      c.sufficient = c.n >= st.minAds && c.spend >= st.minSpend;
    });
    const sufficientVals = Object.values(cellMap).filter(c=>c.sufficient);
    const [minRoas, maxRoas] = iaRobustDomain(sufficientVals.map(c=>c.roas));

    const __html = `
      <div class="hm-controls">
        <div class="hm-field" data-axis="y"><label>Y axis &middot; rows</label>${xselect({id:'ia2dY', value:st.y, options:stageOpts})}</div>
        <div class="hm-field" data-axis="x"><label>X axis &middot; columns</label>${xselect({id:'ia2dX', value:st.x, options:stageOpts})}</div>
        <div class="hm-field"><label>Min ads / cell</label>
          <div class="hm-range"><input type="range" id="ia2dMinAds" min="1" max="8" step="1" value="${st.minAds}"><span class="tabnum">${st.minAds}</span></div>
        </div>
        <div class="hm-field"><label>Min spend / cell</label>
          <div class="hm-range"><input type="range" id="ia2dMinSpend" min="0" max="100000" step="2500" value="${st.minSpend}"><span class="tabnum">${fmtINR(st.minSpend)}</span></div>
        </div>
      </div>
      <div class="hm-scroll">
        ${ys.length===0 || xs.length===0 ? `<div class="hm-empty">No ads in this scope combine these two stages.</div>` : `
        <div class="hm-grid" style="grid-template-columns:150px repeat(${xs.length},minmax(70px,1fr))">
          <div class="hm-corner"></div>
          ${xs.map(x=>`<div class="hm-colhead" title="${esc(x)}">${esc(x.length>16?x.slice(0,15)+'…':x)}</div>`).join('')}
          ${ys.map(y=>`
            <div class="hm-rowhead" title="${esc(y)}">${esc(y.length>20?y.slice(0,19)+'…':y)}</div>
            ${xs.map(x=>{
              const c = cellMap[x+'|'+y];
              if(!c || !c.sufficient){
                return `<div class="hm-cell insufficient" data-tip="${c?tipAttr('Insufficient data',[['Ads',fmtNum(c.n)],['Spend',fmtINR(c.spend)]]):''}">&mdash;</div>`;
              }
              const color = iaRangeHeatColor(c.roas, minRoas, maxRoas);
              const txt = iaReadableTextColor(color);
              return `<div class="hm-cell filled" style="background:${color};color:${txt}" data-tip="${tipAttr(x+' × '+y,[['Spend',fmtINR(c.spend)],['ROAS',fmtRoas(c.roas)]])}"><b>${fmtRoas(c.roas)}</b><span class="ad-count-link" data-ad-ids="${adsIdsAttr(c.ads)}" data-filter-label="${esc(x+' × '+y)}">${fmtNum(c.n)} ads</span></div>`;
            }).join('')}
          `).join('')}
        </div>`}
      </div>
      <div class="legend hm-legend">
        <span>Low ROAS</span>
        <div class="hm-legend-gradient"></div>
        <span>High ROAS</span>
        <span style="margin-left:auto;color:var(--color-text-faint)">&mdash; below min ads/spend bar</span>
      </div>`;
    if(soft){ const tmp=document.createElement('div'); tmp.innerHTML=__html; hmSoftSwap(root, tmp, '.hm-controls'); }
    else root.innerHTML = __html;
    wireXSelects(root, {
      ia2dX: v=>{ st.x=v; draw(); },
      ia2dY: v=>{ st.y=v; draw(); },
    });
    root.querySelectorAll('.qv').forEach(btn=>{
      btn.onclick = ()=>{ st.x=btn.dataset.qvx; st.y=btn.dataset.qvy; draw(); };
    });
    const slider = root.querySelector('#ia2dMinAds');
    const softDraw2d = hmFrame(()=>draw(true));
    if(slider) slider.oninput = ()=>{ st.minAds=parseInt(slider.value,10); hmSliderLabel(slider, st.minAds); softDraw2d(); };
    const spendSlider = root.querySelector('#ia2dMinSpend');
    if(spendSlider) spendSlider.oninput = ()=>{ st.minSpend=parseInt(spendSlider.value,10); hmSliderLabel(spendSlider, fmtINR(st.minSpend)); softDraw2d(); };
    wireTooltips(root);
    wireAdCountLinks(root);
  }
  draw();
}

const IA_AXIS3D_COLORS = { get x(){return document.documentElement.dataset.theme==='light'?'#d4574a':'#a78bfa';}, get y(){return document.documentElement.dataset.theme==='light'?'#3b82f6':'#ec4899';}, get z(){return document.documentElement.dataset.theme==='light'?'#0891b2':'#f0abfc';} };

var IA3D_MOUNT_TOKEN = 0;
function mountIaHeatmap3D(){
  const mountRoot = document.getElementById('ia3dRoot');
  if(!mountRoot) return;
  const myToken = ++IA3D_MOUNT_TOKEN;
  const st = { x:'hook-line', y:'primary-usp-claim', z:'cta-text', minAds:2, minSpend:0, rx:-22, ry:-32, zoom:0.82 };
  const STEP=90, TOPK=5;

  function topAngles(ads, key){
    const counts={};
    ads.forEach(ad=>{ const v=ad.stages[key]; if(v) counts[v]=(counts[v]||0)+1; });
    return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,TOPK);
  }
  function buildCube(){
    const ads = iaFilteredAds().filter(ad=>ad.stages[st.x]&&ad.stages[st.y]&&ad.stages[st.z]);
    const xs=topAngles(ads,st.x), ys=topAngles(ads,st.y), zs=topAngles(ads,st.z);
    const xi={},yi={},zi={}; xs.forEach((v,i)=>xi[v]=i); ys.forEach((v,i)=>yi[v]=i); zs.forEach((v,i)=>zi[v]=i);
    const cellMap={};
    ads.forEach(ad=>{
      const vx=ad.stages[st.x],vy=ad.stages[st.y],vz=ad.stages[st.z];
      if(!(vx in xi)||!(vy in yi)||!(vz in zi)) return;
      const key=vx+'|'+vy+'|'+vz;
      if(!cellMap[key]) cellMap[key]={x:vx,y:vy,z:vz,ix:xi[vx],iy:yi[vy],iz:zi[vz],n:0,spend:0,revenue:0};
      const c=cellMap[key]; c.n++; c.spend+=ad.spend; c.revenue+=ad.revenue;
    });
    const cells = Object.values(cellMap).map(c=>{ c.roas=c.spend?c.revenue/c.spend:0; c.sufficient=c.n>=st.minAds && c.spend>=st.minSpend; return c; });
    return {xs,ys,zs,cells,totalAds:ads.length};
  }

  function makeFace(cls,w,h,transform,color){
    const f=document.createElement('div');
    f.className='ia3d-face '+cls; f.style.width=w+'px'; f.style.height=h+'px'; f.style.transform=transform; f.style.background=color;
    return f;
  }
  function makeCube(size,color){
    const half=size/2, box=document.createElement('div');
    box.className='ia3d-cube';
    box.style.width=size+'px'; box.style.height=size+'px';
    box.appendChild(makeFace('front',size,size,`translateZ(${half}px)`,color));
    box.appendChild(makeFace('back',size,size,`rotateY(180deg) translateZ(${half}px)`,color));
    box.appendChild(makeFace('right',size,size,`rotateY(90deg) translateZ(${half}px)`,color));
    box.appendChild(makeFace('left',size,size,`rotateY(-90deg) translateZ(${half}px)`,color));
    box.appendChild(makeFace('top',size,size,`rotateX(90deg) translateZ(${half}px)`,color));
    box.appendChild(makeFace('bottom',size,size,`rotateX(-90deg) translateZ(${half}px)`,color));
    return box;
  }
  function beadLine(world,x1,y1,z1,x2,y2,z2,color,bead,gap,cls){
    const dx=x2-x1,dy=y2-y1,dz=z2-z1, len=Math.sqrt(dx*dx+dy*dy+dz*dz);
    const steps=Math.max(1,Math.round(len/gap));
    for(let i=0;i<=steps;i++){
      const t=i/steps, b=makeCube(bead,color);
      b.classList.add(cls);
      b.style.transform = `translate3d(${x1+dx*t-bead/2}px,${y1+dy*t-bead/2}px,${z1+dz*t-bead/2}px)`;
      b.style.filter = `drop-shadow(0 0 3px ${color})`;
      world.appendChild(b);
    }
  }

    const el=document.createElement('div');
    el.className='ia3d-label '+cls; el.innerHTML=html;

    world.appendChild(el);
    applyBillboard(el);
  }
  function applyBillboard(el){
    const p=el._pos;

  }

  function draw(soft){

        <div class="hm-field"><label>Z axis &middot; depth</label>${xselect({id:'ia3dZ', value:st.z, options:stageOpts})}</div>
        <div class="hm-field"><label>Min ads / cell</label>

          </div>
          <div class="ia3d-stats tabnum">${fmtNum(data.totalAds)} ads use all three stages &middot; ${data.cells.filter(c=>c.sufficient).length} cells shown &middot; ${data.cells.filter(c=>!c.sufficient).length} below the min-ads/spend bar</div>
        </div>
        ${nx===0||ny===0||nz===0||data.cells.length===0?`<div class="ia3d-empty"><b>No ad in this scope combines these three stages.</b><span>Try a different axis pairing or lower the min-ads/spend bar.</span></div>`:''}
      </div>`;
    if(soft){ const tmp=document.createElement('div'); tmp.innerHTML=__html3; hmSoftSwap(mountRoot, tmp, '.hm-controls'); }
    else mountRoot.innerHTML = __html3;

    wireXSelects(mountRoot, {
      ia3dX: v=>{ st.x=v; draw(); },

    const floor = document.createElement('div');

    floor.style.transform = `translate3d(${-STEP/2}px,${gh/2+STEP*0.6}px,${-STEP/2}px) rotateX(90deg)`;

        const glowSize = size*2.1;
        const glow = document.createElement('div');
        glow.className='ia3d-glow';
        glow.style.width=glowSize+'px'; glow.style.height=glowSize+'px';

        glow.style.transform = `translate3d(${px-glowSize/2}px,${gh/2+STEP*0.58-glowSize/2}px,${pz-glowSize/2}px) rotateX(90deg)`;
        world.appendChild(glow);

        const cube = makeCube(size,color);
        cube.style.transform = `translate3d(${px-size/2}px,${py-size/2}px,${pz-size/2}px)`;
        cube.dataset.tip = tipHtml(c.x+' × '+c.y+' × '+c.z, [['Ads',fmtNum(c.n)],['Spend',fmtINR(c.spend)],['Revenue',fmtINR(c.revenue)],['ROAS',fmtRoas(c.roas)]]);

        addBillboard(world,'ia3d-value',`<span class="ia3d-pill tabnum">${fmtRoas(c.roas)}<span class="n">${fmtNum(c.n)} ad${c.n===1?'':'s'}</span></span>`, px, py-size/2-15, pz);
      } else {
        const marker=document.createElement('div');
        marker.className='ia3d-marker';
        marker.style.transform=`translate3d(${px}px,${py}px,${pz}px)`;
        world.appendChild(marker);
      }

    const PAD=56;
    const X0=-(gw/2)-PAD, X1=(gw/2)+PAD, Y0=(gh/2)+PAD, Y1=-(gh/2)-PAD, Z0=(gd/2)+PAD, Z1=-(gd/2)-PAD;
    beadLine(world,X0,Y0,Z0,X1,Y0,Z0,IA_AXIS3D_COLORS.x,5,13,'ia3d-bead');
    beadLine(world,X0,Y0,Z0,X0,Y1,Z0,IA_AXIS3D_COLORS.y,5,13,'ia3d-bead');
    beadLine(world,X0,Y0,Z0,X0,Y0,Z1,IA_AXIS3D_COLORS.z,5,13,'ia3d-bead');

    data.xs.forEach((v,i)=>{
      const lane=i%2, tx=i*STEP-gw/2, ty=Y0, tz=Z0;
      const lx=tx, ly=Y0+(lane?56:28), lz=Z0+(lane?34:0);
      beadLine(world,tx,ty,tz,lx,ly,lz,IA_AXIS3D_COLORS.x,2.5,7,'ia3d-leader');
      addBillboard(world,'ia3d-tick x',esc(v.length>18?v.slice(0,17)+'…':v), lx,ly,lz);
    });
    data.ys.forEach((v,i)=>{
      addBillboard(world,'ia3d-tick y',esc(v.length>18?v.slice(0,17)+'…':v), X0-26, gh/2-i*STEP, Z0);
    });
    data.zs.forEach((v,i)=>{
      const lane=i%2, tx=X0, ty=Y0, tz=i*STEP-gd/2;
      const lx=X0-(lane?40:14), ly=Y0+(lane?52:26), lz=tz;

    addBillboard(world,'ia3d-axistitle y', stageLabelOf(st.y).toUpperCase(), X0, Y1-30, Z0);
    addBillboard(world,'ia3d-axistitle z', stageLabelOf(st.z).toUpperCase(), X0, Y0, Z1-36);

    applyWorldTransform();
    wireTooltips(mountRoot);

  }

  function applyWorldTransform(){
    const world = document.getElementById('ia3dWorld');
    if(world) world.style.transform = `rotateX(${st.rx}deg) rotateY(${st.ry}deg) scale(${st.zoom})`;
  }
  function wireDrag(){
    const stage = document.getElementById('ia3dStage');
    if(!stage) return;
    let lastX=0, lastY=0;
    stage.addEventListener('pointerdown', e=>{
      st.dragging=true; st.lastInteraction=performance.now();
      lastX=e.clientX; lastY=e.clientY;
      stage.setPointerCapture(e.pointerId); stage.classList.add('dragging');
    });
    stage.addEventListener('pointermove', e=>{
      if(!st.dragging) return;
      st.lastInteraction=performance.now();
      const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
      st.ry += dx*0.35; st.rx = Math.max(-70, Math.min(70, st.rx - dy*0.35));
      applyWorldTransform(); refreshBillboards();
    });
    function end(){ st.dragging=false; st.lastInteraction=performance.now(); stage.classList.remove('dragging'); }
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointerleave', end);
    stage.addEventListener('wheel', e=>{
      e.preventDefault();
      st.lastInteraction=performance.now();
      st.zoom = Math.max(0.5, Math.min(1.8, st.zoom - e.deltaY*0.0012));
      applyWorldTransform();
    }, {passive:false});
  }

  // Slow ambient turntable when idle -- gives the widget some life at rest,
  // and gets out of the way the instant someone actually drags it.
  const IDLE_MS = 2600, IDLE_SPEED = 0.045;
  function tickAutoRotate(){
    if(myToken !== IA3D_MOUNT_TOKEN) return; // a newer mount replaced this one -- stop for good

    if(!st.dragging && (performance.now()-st.lastInteraction) > IDLE_MS){
      st.ry += IDLE_SPEED;
      applyWorldTransform();
      refreshBillboards();
    }
    requestAnimationFrame(tickAutoRotate);
  }

  st.dragging=false; st.lastInteraction=performance.now();
  draw();
  requestAnimationFrame(tickAutoRotate);
}

function clIcon(svg){ return `<span class="ic" style="width:14px;height:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${svg}</svg></span>`; }
function clTopAngles(ads, key, k){
  const counts = {};
  ads.forEach(ad=>{ const v=ad.stages[key]; if(v) counts[v]=(counts[v]||0)+1; });
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,k);
}
function clWrap(text, maxChars, maxLines){
  const words = String(text).split(/\s+/), lines = [''];
  words.forEach(w=>{
    const cur = lines[lines.length-1];
    if(!cur) lines[lines.length-1] = w;
    else if((cur+' '+w).length <= maxChars) lines[lines.length-1] = cur+' '+w;
    else lines.push(w);
  });
  if(lines.length > maxLines){
    const keep = lines.slice(0, maxLines);
    keep[maxLines-1] = keep[maxLines-1].replace(/.{0,2}$/, '') + '…';
    return keep;
  }
  return lines;
}
function clNiceMax(v){   // 4 even gridline steps with round numbers

  return step*4;
}

    ads.forEach(a=>{
      const vx=a.stages[st.x],vy=a.stages[st.y],vz=a.stages[st.z];

    return {xs,ys,zs,cells,totalAds:ads.length};

    d.zs.forEach((v,i)=>{ const lane=i%2,tz=i*STEP-gd/2,lx=X0-(lane?40:14),ly=Y0+(lane?52:26);

/* ===== Winning & Losing Angles v2: rank everything, trust-adjusted, no CTA, four layout options ===== */
function wl2Compute(){
  const ads = iaFilteredAds().filter(a=>a.spend>0);
  const spendT = ads.reduce((a,x)=>a+x.spend,0), revT = ads.reduce((a,x)=>a+x.revenue,0);
  const base = spendT ? revT/spendT : 0;
  const groups = {};
  ads.forEach(a=>{
    STAGE_DEFS.forEach(sd=>{
      const v = a.stages[sd.key]; if(!v) return;
      const k = sd.key+'||'+v;
      const g = groups[k] || (groups[k] = {stage:sd.key, angle:v, n:0, spend:0, revenue:0, ids:[]});
      g.n++; g.spend+=a.spend; g.revenue+=a.revenue; g.ids.push(a.ad_id);
    });
  });
  const all = Object.values(groups);
  const sorted = all.map(g=>g.spend).sort((a,b)=>a-b);
  const m = 0.9 * (sorted.length ? sorted[Math.floor(sorted.length/2)] : 0);   // same trust rule as the creative ranking engine
  all.forEach(g=>{
    g.roas = g.spend ? g.revenue/g.spend : 0;
    g.trusted = (g.revenue + m*base) / (g.spend + m);          // small spend is pulled toward your average
    g.share = spendT ? g.spend/spendT*100 : 0;
    g.gap = g.spend*(base-g.roas);
  });
  const NOCTA = g => g.stage!=='cta-text';   // CTA appears in the recipe only, never in winners or leaks
  const winners = all.filter(g=>NOCTA(g) && g.trusted>base*1.02).sort((a,b)=>b.trusted-a.trusted).slice(0,5);
  const leaks = all.filter(g=>NOCTA(g) && g.roas<base).sort((a,b)=>b.gap-a.gap).slice(0,5);
  const stages = STAGE_DEFS.filter(s=>s.mandatory);
  const recipe = stages.map(s=>({stage:s, best: all.filter(g=>g.stage===s.key && g.trusted>base).sort((a,b)=>b.trusted-a.trusted)[0]||null}));
  const swaps = stages.map(s=>({stage:s,
    win: all.filter(g=>g.stage===s.key && g.trusted>base*1.02).sort((a,b)=>b.trusted-a.trusted)[0]||null,
    leak: s.key==='cta-text' ? null : all.filter(g=>g.stage===s.key && g.roas<base).sort((a,b)=>b.gap-a.gap)[0]||null}));
  return {ads, spendT, base, all, winners, leaks, recipe, swaps};
}

/* ================================================================
   CREATIVE RANKING ENGINE
   Dataset below is a real pull from the Shesha account's creative-audit
   API (479 ads). Not yet wired to the live paginated endpoint -- swap
   CREATIVE_AUDIT_DATA for a live fetch once auth/CORS is sorted.
   ================================================================ */
/*@@DATASET:CREATIVE_AUDIT_DATA@@*/

/* ---- ranking algorithm (validated in a Python spike before this build) ---- */
function creZscoreMap(rows, field){
  const vals = rows.map(r=>r[field]);
  const mu = vals.reduce((a,b)=>a+b,0)/vals.length;
  const variance = vals.reduce((a,b)=>a+(b-mu)*(b-mu),0)/vals.length;
  const sd = Math.sqrt(variance) || 1;
  return {mu, sd};
}
function computeCreativeRanking(sourceRows){
  // 1. MATERIALITY FLOOR -- a tiny-spend ad can clear every rate-based
  // threshold (a famous case in this very dataset: ad 120245107446850217,
  // ₹10.04 spend, 487x ROAS) and Bayesian shrinkage alone doesn't guarantee
  // it won't still land near the top -- it's a blend toward baseline, not a
  // hard exclusion. This used to be 0.3% of the dataset's OWN total spend,
  // which sounds conservative but, on this account's lumpy spend
  // distribution, worked out to ~₹84,000 -- excluding 361 of 444 ads,
  // including a ₹83,363-spend creative running 3.71x ROAS. A real,
  // meaningfully-spending creative should never be silently left out of the
  // ranking entirely; a flat, deliberately low floor (business call, not
  // derived from the data) now only drops genuine near-zero test spend, and
  // everything else is scored and ranked -- trustworthiness at low spend is
  // handled by shrinkage (step 3) and the spend term (step 6), not by
  // exclusion. Excluded rows are still reported in the summary, not
  // silently dropped.
  const allSpendRows = sourceRows.filter(r=>r.total_spend>0);
  const minSpend = 800;
  const excludedCount = allSpendRows.filter(r=>r.total_spend<minSpend).length;
  const rows = allSpendRows.filter(r=>r.total_spend>=minSpend).map(r=>Object.assign({}, r));
  if(!rows.length) return {rows:[], excludedCount, minSpend, allSpendRows};

  // CREDIBILITY THRESHOLD (m, used in step 3 below) is no longer a manual
  // slider -- it's derived straight from the account's own spend: 90% of
  // this account's median spend. No manual tuning, no knob to accidentally
  // leave on a value that quietly stopped matching the account. A bigger
  // account (higher median spend) gets a proportionally bigger credibility
  // bar before a creative's own ROAS number is trusted; a smaller account
  // gets a smaller one.
  function creMedianSpend(arr){
    const s = arr.slice().sort((a,b)=>a-b);
    const m = Math.floor(s.length/2);
    return s.length ? (s.length%2 ? s[m] : (s[m-1]+s[m])/2) : 0;
  }
  const mTrust = creMedianSpend(allSpendRows.map(r=>r.total_spend)) * 0.9;

  const RATE_FIELDS = ['roas','conversion_percentage','atc_percentage','lpv_percentage'];

  // sanity-cap percentages at 100 (source data has a 225% ATC-rate quirk)
  rows.forEach(r=>{
    r.atc_percentage = Math.min(r.atc_percentage, 100);
    r.conversion_percentage = Math.min(r.conversion_percentage, 100);
    r.lpv_percentage = Math.min(r.lpv_percentage, 100);
  });

  // 2. winsorize each rate metric at scope p90 (roas also floored at 3x baseline)
  const totalSpend = rows.reduce((a,r)=>a+r.total_spend,0);
  const totalRevenue = rows.reduce((a,r)=>a+r.purchase_value,0);
  const baselines = {}, caps = {};
  RATE_FIELDS.forEach(f=>{
    const sorted = rows.map(r=>r[f]).sort((a,b)=>a-b);
    const p90 = sorted[Math.floor(0.9*sorted.length)];
    if(f==='roas'){
      const C = totalRevenue/totalSpend;
      baselines[f] = C;
      caps[f] = Math.max(p90, 3*C);
    } else {
      const C = rows.reduce((a,r)=>a+r[f]*r.total_spend,0)/totalSpend;
      baselines[f] = C;
      caps[f] = Math.max(p90, 2*C, 1e-6);
    }
  });

  // 3. Bayesian-shrink each capped rate metric toward baseline, trust = spend
  rows.forEach(r=>{
    const w = r.total_spend/(r.total_spend+mTrust);
    RATE_FIELDS.forEach(f=>{
      const capped = Math.min(r[f], caps[f]);
      r[f+'_trusted'] = w*capped + (1-w)*baselines[f];
    });
    r._trustWeight = w;
  });

  // 4. frequency penalty, winsorized at the pool's own p90 the same way
  // every rate metric already is in step 2 (stops one extreme outlier, e.g.
  // a creative run at frequency 26, from blowing out the scale).
  const FREQ_HEALTHY = 1.5;
  const freqSorted = rows.map(r=>r.frequency).sort((a,b)=>a-b);
  const freqExcessCap = Math.max(freqSorted[Math.floor(0.9*freqSorted.length)] - FREQ_HEALTHY, 1e-6);
  rows.forEach(r=>{ r.freq_excess = Math.min(Math.max(0, r.frequency-FREQ_HEALTHY), freqExcessCap); });

  // 5. z-score the trusted rate metrics AND freq_excess, all the SAME way.
  // freq_excess used to be divided by a fixed constant instead of properly
  // z-scored, on the theory that "most creatives sit at 0 excess, so
  // z-scoring would make any small excess look like a wild outlier." That
  // assumption doesn't hold at real account scale -- audited on 83 live
  // scored creatives, the MEDIAN frequency excess was ~1.05, not 0 -- so the
  // fixed-scale version produced a term that was negative for nearly every
  // row (mean -1.07 across the whole pool, never positive), acting as a
  // standing penalty rather than a modifier, and burying 14 creatives with
  // real spend (up to ₹13L+) and decent-to-good ROAS (up to 2.85x, above
  // this account's own 2.65x average) in the bottom third of the ranking
  // for a reason that had nothing to do with how well they converted. A
  // proper z-score is mean-zero by construction: a creative at the pool's
  // typical frequency now scores near 0 (neither rewarded nor punished),
  // same as a creative at typical ROAS or conversion, and only genuinely
  // unusual frequency moves the term meaningfully, exactly how the other
  // two terms already behave.
  const zstats = {};
  RATE_FIELDS.forEach(f=>{ zstats[f+'_trusted'] = creZscoreMap(rows, f+'_trusted'); });
  const freqExcessStats = creZscoreMap(rows, 'freq_excess');
  rows.forEach(r=>{
    RATE_FIELDS.forEach(f=>{
      const st = zstats[f+'_trusted'];
      r['z_'+f] = (r[f+'_trusted']-st.mu)/st.sd;
    });
    r.z_freq_excess = (r.freq_excess - freqExcessStats.mu) / freqExcessStats.sd;
  });

  // 5b. SPEND, as its own scored signal, not just a trust gate. Before this,
  // spend only entered the formula as the Bayesian trust weight above, and
  // that weight SATURATES fast (at m=20,000: ₹50k spend already gets 71%
  // trust, ₹3L gets 94%, ₹8L gets 98%) -- past roughly ₹1L it barely
  // distinguishes "proven" from "proven at serious scale" at all. That's why
  // a high-spend, high-ROAS creative wasn't reliably outranking a
  // merely-trustworthy one: trust alone has nothing left to reward past the
  // saturation point. Spend is heavily right-skewed on this account (median
  // ~₹14k, max ₹13.5L+), so it's log-scaled first the same way a rate metric
  // gets winsorized -- that keeps a few extreme spenders from dominating the
  // z-score the way raw rupees would -- then z-scored like every other
  // signal here, and added into the weighted sum with its own positive
  // weight (step 6). This is additive to the trust weight, not a
  // replacement for it: trust still answers "how much do I believe this
  // ROAS number," the spend term answers "how proven is this at scale,"
  // and together they produce the four-way read this was built for -- high
  // spend + high ROAS scores best, high spend + low ROAS still scores worst
  // (trust keeps the bad ROAS fully visible), low spend + low ROAS is
  // dampened toward neutral by low trust, and low spend + high ROAS is
  // real credit, just capped below a proven performer by both the trust
  // discount and the negative spend term.
  rows.forEach(r=>{ r.log_spend = Math.log(r.total_spend + 1); });
  const spendStats = creZscoreMap(rows, 'log_spend');
  rows.forEach(r=>{ r.z_spend = (r.log_spend - spendStats.mu) / spendStats.sd; });

  // 6. weighted sum -> CONFIDENCE WEIGHT -> tanh -> [0,1]. ONLY ROAS (the real
  // outcome) and conversion_percentage (the funnel metric closest to that
  // outcome) are weighted -- atc_percentage and lpv_percentage are still shown
  // per row as diagnostic context, but excluded from the score itself. All
  // four used to be weighted independently, but conversion/ATC/LPV aren't
  // separate signals, they're nested funnel stages that already feed into
  // ROAS -- scoring all of them was double-counting the same "this ad
  // converts" evidence multiple times. Weights are still heuristic (not
  // fitted to real revenue outcomes), but no longer double-counting.
  //
  // CRITICAL: shrinking the *input* ROAS toward baseline (step 3) is not
  // enough on its own. A ₹600-spend ad can still land a shrunk ROAS and a
  // z-score that is *mathematically* large even after shrinkage, if its raw
  // ROAS was extreme enough to begin with -- and tanh doesn't saturate fast
  // enough to catch that on a single multiplicative pass. A ₹600-spend ad at
  // 5.8x ROAS was still outranking a proven ₹19,700-spend ad at 2.3x ROAS
  // even after multiplying the signal by trust once. So a GOOD (positive)
  // composite signal is multiplied by the trust weight SQUARED
  // (_trustWeight^2, 0->1): squaring makes the penalty bite much harder at
  // low trust (0.4 trust -> 0.16x signal, not 0.4x) while barely touching
  // high-trust rows (0.95 trust -> 0.90x signal, basically untouched). This
  // is what makes "₹600 spend at 6x ROAS" rank below "₹15,000+ spend at 3x
  // ROAS" -- proven, trustworthy performance beats an unproven number, every
  // time.
  //
  // This is deliberately ONE-SIDED: a BAD (negative) signal is left alone,
  // not also multiplied by trust^2. Squaring trust on a negative number
  // doesn't just soften it, it can flip relative order, because trust and
  // the raw signal both vary per row: audited on real data, a ₹2,336-spend,
  // 3.93x-ROAS ad (raw signal -0.95, trust 10.5%) came out ranked WORSE than
  // a ₹1,518-spend, 0.93x-ROAS ad (raw signal -1.89, trust 7.1%) -- because
  // -0.95 x 0.105^2 (-0.0104) is actually more negative than -1.89 x 0.071^2
  // (-0.0094). Higher trust multiplying a still-negative number pushes it
  // FURTHER negative, so a genuinely-better, more-trustworthy creative could
  // end up scored worse than a genuinely-worse, less-trustworthy one --
  // exactly backwards. Bad creatives are already correctly told apart by the
  // raw signal itself (step 3's shrinkage and the spend term above already
  // discount an unproven low-spend ad's numbers before this point); they
  // don't need a second, sign-breaking multiplication on top.
  // Conversion weight trimmed from 0.5 to 0.2 for the same reason as the
  // frequency fix above: audited against a strict rule the ROAS-only signal
  // already satisfies almost everywhere (a trustworthy-spend, 2x+ ROAS
  // creative must never fall in the bottom third), adding conversion% at
  // full weight re-introduced outliers the ROAS term alone did not have --
  // conversion% is noisier per-ad than ROAS and was overriding a genuinely
  // good trusted-ROAS read often enough to matter. Keeping a reduced weight
  // instead of dropping it to 0 still lets two ROAS-tied creatives be told
  // apart by funnel quality, just without letting it outvote ROAS itself.
  const WEIGHTS = { roas:1.0, conversion_percentage:0.2, freq_excess:-0.3, spend:1.0 };
  rows.forEach(r=>{
    const rawSignal = WEIGHTS.roas*r.z_roas + WEIGHTS.conversion_percentage*r.z_conversion_percentage +
                       WEIGHTS.freq_excess*r.z_freq_excess + WEIGHTS.spend*r.z_spend;
    const trustMult = rawSignal >= 0 ? (r._trustWeight * r._trustWeight) : 1;
    const signal = rawSignal * trustMult;
    r.rawSignal = rawSignal;
    r.signal = signal;
    r.score = 0.5*(Math.tanh(signal)+1);
    r.baselineRoas = baselines.roas;
  });

  // 7. PROTECTED FLOOR. Even after the weight fix above, pure relative
  // ranking has a structural ceiling: in an account whose scored pool
  // already averages ~2.7x ROAS, a creative at a genuinely good *absolute*
  // 2.0-2.5x ROAS will still look below-average next to this account's many
  // 3-4x performers, and a purely continuous rank will keep shoving it
  // toward the bottom no matter how the weights are tuned (audited: even a
  // ROAS-ONLY signal, zero conversion/frequency terms at all, still left 9
  // high-spend 2x+ creatives in the bottom third). Relative ranking and "a
  // trustworthy 2x+ ROAS creative is never bad" are simply incompatible
  // without an explicit rule, so one is added here, on top of the
  // continuous math rather than folded into it: any creative with
  // above-median spend (trustworthy, not a fluke) AND trusted ROAS >= 2.0x
  // (the same "good ROAS" bar used everywhere else in this engine) is
  // PROTECTED and may never be placed in the bottom third of the ranking.
  // The partition is global, not a local swap, and minimally disruptive --
  // it only decides which creatives occupy the bottom third at all; every
  // creative that stays out of that zone keeps its exact natural relative
  // order from the continuous signal, so the top of the list (the genuinely
  // best creatives) is completely untouched by this step.
  function creMedian(arr){
    const s = arr.slice().sort((a,b)=>a-b);
    const m = Math.floor(s.length/2);
    return s.length ? (s.length%2 ? s[m] : (s[m-1]+s[m])/2) : 0;
  }
  const medSpendForFloor = creMedian(rows.map(r=>r.total_spend));
  const ROAS_FLOOR_GOOD = 2.0;
  const isProtectedFromBottom = r => r.total_spend >= medSpendForFloor && r.roas_trusted >= ROAS_FLOOR_GOOD;

  const naturalOrder = rows.slice().sort((a,b)=>b.signal-a.signal);
  const bottomZoneSize = Math.floor(naturalOrder.length/3);
  const unprotectedInOrder = naturalOrder.filter(r=>!isProtectedFromBottom(r));
  const bottomZoneMembers = unprotectedInOrder.slice(unprotectedInOrder.length - bottomZoneSize);
  const bottomZoneSet = new Set(bottomZoneMembers);
  const orderedRows = naturalOrder.filter(r=>!bottomZoneSet.has(r)).concat(bottomZoneMembers);

  // 8. map to a 0-96 display scale, top always exactly 96.00, every score
  // UNIQUE -- no two creatives ever show the same number. Whole-integer
  // uniqueness (0-96, 97 possible values) only worked back when ~83 ads were
  // scored; ranking everything now scores 300-400+ at once, and packing that
  // many distinct INTEGERS into 97 slots is mathematically impossible. The
  // fix isn't to allow ties -- it's to stop rationing uniqueness in whole
  // points. Working in hundredths (0-9600 "centi-points", i.e. 2 decimal
  // places once displayed) gives 9,601 possible values, comfortably more
  // than any realistic creative count, so the same forward+backward
  // uniqueness algorithm this engine has always used (decrement by the
  // smallest unit going down the list, then correct any collapsed tail
  // walking back up) works again without exhausting its range.
  const CRE_SCALE = 9600; // = 96.00 at 2 decimal places (1 unit = 0.01)
  const natural = orderedRows.map(r=>Math.round(r.score*CRE_SCALE));
  const display = new Array(orderedRows.length);
  display[0] = CRE_SCALE;
  for(let i=1;i<orderedRows.length;i++){
    display[i] = Math.min(natural[i], display[i-1]-1);
  }
  for(let i=orderedRows.length-1;i>=0;i--){
    if(i===orderedRows.length-1){
      if(display[i]<1) display[i] = 1;
    } else if(display[i]<=display[i+1]){
      display[i] = display[i+1]+1;
    }
  }
  // Stored as the real 0-96 float (2 decimals), not the raw centi-point
  // integer -- every other part of the UI (tier-color thresholds, the score
  // bar's width%, the tooltip) already reasons in the 0-96 range.
  orderedRows.forEach((r,i)=>{ r.displayScore = Math.round(display[i])/100; r.rank = i+1; });
  if(orderedRows.length) orderedRows[0].displayScore = 96;
  rows.sort((a,b)=>a.rank-b.rank);
  return {rows, excludedCount, minSpend, allSpendRows};
}
