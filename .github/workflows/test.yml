name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r worker/requirements-dev.txt
      - run: npm ci || npm install
      - run: npm test
      - run: python -m pytest worker/tests -q
