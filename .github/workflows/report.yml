name: report-worker

# Started by the API (workflow_dispatch) when a user generates a report. Runs the whole pipeline for one report.
on:
  repository_dispatch:
    types: [run-report]
  workflow_dispatch:
    inputs:
      report_id:
        description: Report id (uuid)
        required: true

concurrency:
  group: report-${{ github.event.client_payload.report_id || inputs.report_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPORT_ID: ${{ github.event.client_payload.report_id || inputs.report_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -r worker/requirements.txt
      - name: Run the pipeline
        run: python -m worker.run --report "$REPORT_ID"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL }}
          CLUSTER_MODEL: ${{ vars.CLUSTER_MODEL }}
          INSIGHT_MODEL: ${{ vars.INSIGHT_MODEL }}
          EXTRACT_CONCURRENCY: ${{ vars.EXTRACT_CONCURRENCY }}
          LAB_MIN_ADS: ${{ vars.LAB_MIN_ADS }}
          LAB_MIN_SPEND: ${{ vars.LAB_MIN_SPEND }}
